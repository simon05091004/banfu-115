<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf8f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}
:root{
  --paper:#faf8f4; --card:#ffffff; --ink:#1e1c19; --dim:#6d675e; --faint:#989185;
  --line:#e4dfd5; --sunk:#f4f1ea;
  --a1:#a1670f; --a1-bg:#fbf3e2; --a2:#1d5ba4; --a2-bg:#edf3fc; --a3:#1c7549; --a3-bg:#eaf6ef;
  --a4:#7a3f8c; --a4-bg:#f8eefb;
  --focus:#1d5ba4;
  --sh:0 1px 2px rgba(40,32,18,.05), 0 10px 34px -14px rgba(40,32,18,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1a1815; --card:#232019; --ink:#ece6dc; --dim:#a09789; --faint:#7b7366;
    --line:#35312a; --sunk:#1f1c17;
    --a1:#e3a943; --a1-bg:#332a17; --a2:#7db0ef; --a2-bg:#1a2634; --a3:#5ec68e; --a3-bg:#172b20;
    --a4:#cb99dc; --a4-bg:#2b1f31;
    --focus:#7db0ef;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 10px 34px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#1a1815; --card:#232019; --ink:#ece6dc; --dim:#a09789; --faint:#7b7366;
  --line:#35312a; --sunk:#1f1c17;
  --a1:#e3a943; --a1-bg:#332a17; --a2:#7db0ef; --a2-bg:#1a2634; --a3:#5ec68e; --a3-bg:#172b20;
  --a4:#cb99dc; --a4-bg:#2b1f31;
  --focus:#7db0ef;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 10px 34px -14px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.65 "Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px 64px;display:flex;flex-direction:column;gap:24px}
header{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.eyebrow{margin:0;font-size:12.5px;letter-spacing:.14em;color:var(--dim);font-weight:500}
.who{font-size:12px;font-weight:600;letter-spacing:.1em;padding:3px 12px;border-radius:999px}
.who.p1{color:var(--a1);background:var(--a1-bg)} .who.p2{color:var(--a2);background:var(--a2-bg)}
.who.p3{color:var(--a3);background:var(--a3-bg)} .who.p4{color:var(--a4);background:var(--a4-bg)}
h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(24px,5.6vw,31px);
  line-height:1.32;text-wrap:balance}
.lede{margin:0;color:var(--dim);font-size:15px}

/* QR 卡片：不論深淺色主題都保持白底黑碼，確保掃得到 */
.qrcard{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);
  padding:26px 26px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.qrcard svg{width:min(320px,72vw);height:auto;display:block;shape-rendering:crispEdges}
.url{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11.5px;color:#6d675e;
  word-break:break-all;text-align:center;line-height:1.5;max-width:34ch}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{appearance:none;font:inherit;font-size:15px;font-weight:600;border-radius:11px;padding:12px 20px;
  cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:opacity .12s,transform .08s}
.btn:hover{opacity:.87} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--dim);opacity:1}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:13px;align-items:flex-start;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.steps li::before{content:counter(s);flex:0 0 24px;height:24px;border-radius:50%;
  background:var(--sunk);color:var(--dim);font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  font-weight:500;display:grid;place-items:center;margin-top:1px}
.steps b{display:block;font-size:15px;font-weight:600}
.steps span{display:block;font-size:13.5px;color:var(--dim);margin-top:1px}

.palette{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;
  display:flex;flex-direction:column;gap:10px}
.palette h2,.when h2{margin:0;font-family:"Noto Serif TC",serif;font-size:15px;font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:7px}
.sw{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px}
.sw i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.16);display:block}

.when{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:baseline;gap:10px;font-size:14px}
.row .k{flex:0 0 74px;font-size:12.5px;color:var(--dim);font-weight:600}
.row em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.note{margin:0;font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px;line-height:1.7}
footer{text-align:center;color:var(--faint);font-size:12.5px;line-height:1.8}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:11px;font-size:14px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:12mm 10mm}
  .actions,#toast{display:none!important}
  .qrcard{box-shadow:none;break-inside:avoid}
  .qrcard svg{width:96mm}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">__EYEBROW__</p>
    <span class="who __TONE__">__WHO__</span>
    <h1>__H1__</h1>
    <p class="lede">__LEDE__</p>
  </header>

  <div class="qrcard">
    <svg viewBox="-4 -4 __QRSIZE__ __QRSIZE__" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="共編表網址 QR code">
      <rect x="-4" y="-4" width="__QRSIZE__" height="__QRSIZE__" fill="#ffffff"/>
      <path fill="#1e1c19" d="__QRPATH__"/>
    </svg>
    <p class="url" id="url">__URL__</p>
  </div>

  <div class="actions">
    <a class="btn" id="open" href="__URL__">開啟共編表</a>
    <button class="btn ghost" id="copy" type="button">複製連結</button>
  </div>

  <ol class="steps">
__STEPS__
  </ol>

  <section class="palette"__PALETTEHIDE__>
    <h2>可選色票</h2>
    <div class="sws">__PALETTE__</div>
  </section>

  <section class="when">
    <div class="row"><span class="k">繳交期限</span><em>__DEADLINE__</em></div>
    <div class="row"><span class="k">適用班級</span><em>__CLASSRANGE__</em>　共 __NCLASSES__ 班</div>
    <div class="row"><span class="k">承辦</span>__CONTACT__</div>
    <p class="note">__NOTE__</p>
  </section>

  <footer>__FOOTER__</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var URL_ = document.getElementById("url").textContent.trim();
  var t = document.getElementById("toast");
  function toast(m){ t.textContent = m; t.classList.add("show"); clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2400); }
  document.getElementById("copy").addEventListener("click", async function(){
    try{
      if(navigator.share){ await navigator.share({title:document.title, url:URL_}); return; }
      await navigator.clipboard.writeText(URL_);
      toast("連結已複製");
    }catch(e){
      if(e && e.name === "AbortError") return;
      try{ await navigator.clipboard.writeText(URL_); toast("連結已複製"); }
      catch(e2){ toast("請長按上方網址手動複製"); }
    }
  });
})();
</script>
</body>
</html>
