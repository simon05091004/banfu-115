<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>畢旅同房志願彙整｜603 導師</title>
<style>
:root{
  color-scheme:light;
  --bg:#E8EEF5; --card:#FFFFFF; --sunk:#F2F6FB;
  --ink:#17283C; --soft:#4C5F76; --faint:#75879B; --line:#C6D3E1; --hair:#DDE6EF;
  --navy:#1F4E79; --navy-ink:#FFFFFF; --head:#DCE6F1; --pick:#E4EEF9;
  --brass-bg:#FFF1D2; --brass-line:#E3BE76; --brass-ink:#6B4710;
  --bad:#B3261E; --bad-bg:#FCE9E7; --bad-line:#E9B3AE; --ok:#1B6E48; --ok-bg:#DFF2E8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",sans-serif; font-size:16px; line-height:1.6}
button,select,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
button:disabled{opacity:.45; cursor:default}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--navy); outline-offset:2px}
h1,h2,h3{margin:0; color:var(--navy); text-wrap:balance}
.app{max-width:1240px; margin:0 auto; padding:0 20px 60px}
.bar{display:flex; align-items:center; gap:14px; padding:18px 0 14px; flex-wrap:wrap}
.tag{flex:none; width:36px; height:52px}
.brand{margin-right:auto}
.brand h1{font-size:24px; line-height:1.3}
.brand p{margin:0; color:var(--soft); font-size:14px}
.acts{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1.5px solid var(--line); background:var(--card); border-radius:9px; min-height:42px; padding:6px 16px; font-weight:600}
.btn.pri{background:var(--navy); border-color:var(--navy); color:var(--navy-ink)}
.btn.sm{min-height:34px; padding:2px 12px; font-size:14.5px}
.btn.danger{color:var(--bad); border-color:var(--bad-line)}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px}
.card h2{font-size:18px}
.sub{color:var(--soft); font-size:14.5px; margin:4px 0 0}
.gate{max-width:420px; margin:40px auto}
.gate label{display:block; margin:14px 0 4px; font-weight:600}
.gate input,.in{width:100%; border:1.5px solid var(--line); border-radius:9px; background:#fff; padding:8px 12px; min-height:42px}
.gate .btn{width:100%; margin-top:16px}
.err{color:var(--bad); font-weight:600; min-height:1.6em; margin:10px 0 0}
.note{background:var(--brass-bg); border:1px solid var(--brass-line); color:var(--brass-ink); border-radius:10px; padding:10px 15px; margin-bottom:14px; overflow-wrap:anywhere}
.note code{font-family:ui-monospace,Menlo,monospace; background:#fff; padding:1px 6px; border-radius:4px}

/* 數字列 */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:14px}
.kpi{background:var(--card); padding:12px 16px}
.kpi b{display:block; font-size:27px; line-height:1.2; color:var(--navy); font-variant-numeric:tabular-nums}
.kpi b small{font-size:15px; color:var(--soft); font-weight:500}
.kpi span{font-size:14px; color:var(--soft)}
.kpi.hot b{color:var(--bad)}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{border:1.5px solid var(--line); background:var(--card); border-radius:9px; min-height:46px; padding:6px 20px; font-weight:700}
.tabs button[aria-selected="true"]{background:var(--navy); border-color:var(--navy); color:var(--navy-ink)}

/* 表格 */
.scroll{overflow-x:auto; margin:12px -20px -18px; padding:0 20px 18px}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{border:1px solid var(--hair); padding:7px 10px; text-align:left; vertical-align:top}
thead th{background:var(--head); color:var(--navy); font-weight:700; white-space:nowrap; border-color:var(--line)}
tr.grp th{background:var(--sunk); color:var(--navy); font-size:14.5px}
td.c,th.c{text-align:center}
.num{font-variant-numeric:tabular-nums}
.who{border:0; background:none; padding:2px 0; font-weight:700; color:var(--navy); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line); white-space:nowrap; text-align:left}
.p{white-space:nowrap}
.p i{font-style:normal; color:var(--soft); font-variant-numeric:tabular-nums; margin-right:4px}
.p.mu{background:var(--ok-bg); border-radius:6px; padding:2px 7px; margin:0 -3px; font-weight:600}
.p.mu::after{content:" 互選"; color:var(--ok); font-size:13px; font-weight:700}
.p.q{background:var(--brass-bg); color:var(--brass-ink); border-radius:6px; padding:2px 7px; margin:0 -3px}
.list{display:flex; flex-wrap:wrap; gap:2px 14px}
.w3l span{white-space:nowrap}
.w3l>span{display:flex; gap:8px; line-height:1.75}
.w3l>span>i{font-style:normal; color:var(--faint); font-size:13px; width:9px; flex:none}
.w3l .p{margin:0} .w3l .p.mu::after{content:none}
.dim{color:var(--faint)}
.flags{display:flex; flex-wrap:wrap; gap:5px}
.fl{font-size:13.5px; font-weight:600; border-radius:6px; padding:1px 8px; background:var(--sunk); color:var(--soft); white-space:nowrap}
.fl.hot{background:var(--bad-bg); color:var(--bad)}
.fl.mid{background:var(--brass-bg); color:var(--brass-ink)}
.need{white-space:pre-wrap; overflow-wrap:anywhere; min-width:190px}
td .flags{min-width:130px}
.mind.talk{color:var(--bad); font-weight:700}
.mind.try{color:var(--brass-ink); font-weight:600}
td textarea{width:100%; min-width:170px; min-height:44px; border:1px solid var(--line); border-radius:7px; padding:5px 8px; resize:vertical; background:var(--sunk); display:block; line-height:1.5}
.talked{display:flex; gap:6px; align-items:center; font-size:14px; margin-top:5px; white-space:nowrap}
.talked input{width:18px; height:18px; accent-color:var(--navy)}
.seatlist{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.seatlist span{border:1px dashed var(--faint); border-radius:7px; padding:1px 10px; font-variant-numeric:tabular-nums; color:var(--soft)}
.fixes{margin:10px 0 0; padding:0; list-style:none}
.fixes li{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:8px 0; border-top:1px solid var(--hair)}
.fixes li span{flex:1 1 320px}
select{border:1.5px solid var(--line); border-radius:8px; background:#fff; min-height:38px; padding:3px 10px; max-width:100%}

.lst th:nth-child(5){width:17%} .lst th:nth-child(6){width:1%} .lst th:nth-child(8){width:22%}

/* 對照表 */
.mx{width:auto; font-size:14px}
.mx th,.mx td{padding:0; width:38px; height:34px; text-align:center; vertical-align:middle}
.mx thead th{height:auto; padding:6px 3px; font-size:12.5px; line-height:1.3; font-weight:600}
.mx tbody th{width:auto; padding:0 10px; text-align:left; white-space:nowrap; background:var(--sunk); font-weight:600}
.mx td.self{background:repeating-linear-gradient(135deg,var(--hair) 0 3px,transparent 3px 7px)}
.mx td.w1{background:#1F4E79; color:#fff; font-weight:700}
.mx td.w2{background:#4E84B5; color:#fff; font-weight:700}
.mx td.w3{background:#A9C8E4; font-weight:700}
.mx td.k{background:var(--sunk); color:var(--soft)}
.mx td.mu{box-shadow:inset 0 0 0 3px #2BA36B}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px; color:var(--soft); margin-top:10px; align-items:center}
.legend i{display:inline-block; width:18px; height:18px; border-radius:4px; margin-right:6px; vertical-align:-3px}

/* 房間 */
.ctl{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:end}
.ctl label{font-size:14px; font-weight:600; color:var(--soft); display:block}
.ctl .in{width:190px; margin-top:2px; min-height:42px}
.rooms{display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:12px; margin-top:12px}
.room{border:1.5px solid var(--line); border-radius:11px; background:var(--card); overflow:hidden; display:flex; flex-direction:column}
.room h3{display:flex; justify-content:space-between; background:var(--head); padding:7px 13px; font-size:15.5px}
.room h3 small{font-weight:500; color:var(--soft); font-variant-numeric:tabular-nums}
.room.warn{border-color:var(--bad)}
.bed{display:flex; width:100%; gap:10px; align-items:center; border:0; border-top:1px solid var(--hair); background:none; padding:8px 13px; text-align:left; min-height:50px}
.bed:first-of-type{border-top:0}
.bed .nm{font-weight:700; white-space:nowrap; min-width:88px}
.bed .nm i{font-style:normal; font-weight:500; color:var(--soft); margin-right:6px; font-variant-numeric:tabular-nums}
.bed .st{font-size:13.5px; margin-left:auto; text-align:right; line-height:1.4; color:var(--soft)}
.bed .st b{color:var(--ok)} .bed .st u{text-decoration:none; color:var(--brass-ink); font-weight:600} .bed .st s{text-decoration:none; color:var(--bad); font-weight:700}
.bed.sel{background:var(--pick); box-shadow:inset 4px 0 0 var(--navy)}
.bed.empty{color:var(--faint); justify-content:center; border-top-style:dashed}
.room p.w{margin:0; padding:6px 13px; background:var(--bad-bg); color:var(--bad); font-size:14px; font-weight:600}
.tray{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.tray .bed{width:auto; border:1.5px dashed var(--faint); border-radius:9px}
.result{display:grid; gap:6px; margin-top:12px}
.result p{margin:0}
.result b{font-variant-numeric:tabular-nums}
.pairs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.pairs span{background:var(--bad-bg); color:var(--bad); border-radius:8px; padding:3px 6px 3px 12px; font-weight:600}
.pairs button{border:0; background:none; color:inherit; padding:2px 8px; font-weight:700}

dialog{border:1px solid var(--line); border-radius:14px; padding:22px 24px; width:min(680px,calc(100vw - 32px)); max-height:calc(100vh - 48px); color:inherit; overflow:auto}
dialog::backdrop{background:rgba(16,32,52,.45)}
.dl{display:grid; grid-template-columns:auto 1fr; margin:12px 0; border-top:1px solid var(--hair)}
.dl dt,.dl dd{margin:0; padding:8px 0; border-bottom:1px solid var(--hair)}
.dl dt{color:var(--soft); padding-right:20px; white-space:nowrap}
.dl dd{white-space:pre-wrap; overflow-wrap:anywhere}
.ver{border-top:1px solid var(--hair); padding:8px 0; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; font-size:14.5px}
.ver span{flex:1 1 240px}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 20px; border-radius:999px; z-index:9; font-size:15px}
.ph{display:none}
details.set{margin-bottom:14px}
details.set summary{cursor:pointer; font-weight:600; color:var(--navy)}

@media print{
  @page{size:A4 landscape; margin:9mm}
  body{background:#fff; font-size:11px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .app{max-width:none; padding:0}
  .bar,.kpis,.tabs,.noprint,#note,details.set{display:none !important}
  .ph{display:block; margin-bottom:6px; font-size:11px}
  .ph strong{font-size:16px; color:var(--navy); display:block}
  .card{border:0; padding:0; margin:0 0 8px; border-radius:0}
  .scroll{overflow:visible; margin:6px 0 0; padding:0}
  table{font-size:10.5px} th,td{padding:3px 5px} thead{display:table-header-group} tr{break-inside:avoid}
  td textarea{border:0; background:none; padding:0; min-height:0; resize:none; min-width:110px}
  .who{text-decoration:none; padding:0}
  .need{min-width:110px}
  .talked{display:none} .talked.on{display:block}
  .talked.on input{display:none}
  .rooms{grid-template-columns:repeat(4,1fr); gap:7px} .room{break-inside:avoid} .bed{min-height:0; padding:4px 9px} .bed.sel{background:none; box-shadow:none}
  .mx{font-size:10.5px} .mx th,.mx td{width:30px; height:22px; padding:0} .mx thead th{font-size:9.5px; padding:3px 2px} .mx tbody th{padding:0 6px} .mxwrap{break-inside:avoid}
  tr.grp th{font-size:11px; padding:2px 5px} .scroll th,.scroll td{line-height:1.5}
  .card h2{font-size:13px} .fl{font-size:9.5px; padding:0 5px} .flags{gap:3px}
  .p.mu,.p.q{padding:0 4px; margin:0 -2px} .p.mu::after{font-size:9px}
  .w3l>span{line-height:1.45} .w3l>span>i{font-size:9.5px}
  .lst td{padding:2px 5px} td .flags{min-width:0} .lst th:nth-child(5){width:16%} .lst th:nth-child(3){width:24%} .lst th:nth-child(8){width:24%}
  .room h3{font-size:12px; padding:4px 9px} .room h3 small,.bed .st{font-size:9.5px} .bed .nm{min-width:70px} .room p.w{font-size:10px; padding:3px 9px} .tray .bed{padding:2px 8px} .ctl h2{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <svg class="tag" viewBox="0 0 64 92" aria-hidden="true"><path d="M12 2h40a10 10 0 0 1 10 10v68a10 10 0 0 1-10 10H12A10 10 0 0 1 2 80V12A10 10 0 0 1 12 2Z" fill="#1F4E79"/><circle cx="32" cy="15" r="6" fill="#E8EEF5"/><text x="32" y="60" text-anchor="middle" font-family="'PingFang TC','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="24" fill="#fff">603</text><path d="M14 72h36" stroke="#E7C684" stroke-width="2.5" stroke-linecap="round"/></svg>
    <div class="brand"><h1>畢旅同房志願彙整</h1><p id="sub">六年三班導師</p></div>
    <div class="acts" id="acts"></div>
  </header>
  <div id="note"></div>
  <section id="gate" class="card gate" hidden>
    <h2>老師登入</h2>
    <p class="sub">用其他檢核頁同一組老師帳號。這裡有學生的個人狀況，用完請登出。</p>
    <label for="em">帳號</label><input id="em" type="email" autocomplete="username">
    <label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="err" role="alert"></p>
    <button class="btn pri" id="signin">登入</button>
  </section>
  <main id="board" hidden>
    <div class="ph" id="ph"></div>
    <div class="kpis" id="kpis"></div>
    <details class="set" id="setbox"></details>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="out"></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<script>
"use strict";
/* ============================================================
   設定：換年度、換班只改這裡（要和 trip603.html 一致）
   ============================================================ */
var CFG = {
  cls: "六年三班", title: "畢業旅行同房意願", file: "603畢旅同房", seats: 25, perRoom: 4,
  col: "tripRoom603", tcol: "tripRoom603T",
  firebase: {
    apiKey: "AIzaSyAFh8Dmf25j1D9rCpBpCpcxKLVBNsAF4m4", authDomain: "chinese-50d0c.firebaseapp.com", projectId: "chinese-50d0c",
    storageBucket: "chinese-50d0c.firebasestorage.app", messagingSenderId: "1044608618028", appId: "1:1044608618028:web:d95f2811e0dd61bbe30b89"
  }
};
var TAG = {sleep:"晚上睡覺習慣", nervous:"容易緊張", dark:"怕黑", body:"身體不舒服需要照顧"};
var MIND = {yes:"願意", "try":"有點緊張，但會試試看", talk:"需要和老師聊聊"};
var SX = {M:"男", F:"女"};
var DEMO = /[?&]demo/.test(location.search);

var $=function(i){ return document.getElementById(i); };
function el(tag, attrs, kids){
  var e=document.createElement(tag), k;
  for(k in (attrs||{})){
    var v=attrs[k];
    if(v==null || v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k.slice(0,2)==="on") e[k]=v;
    else e.setAttribute(k, v===true?"":v);
  }
  [].concat(kids==null?[]:kids).forEach(function(c){
    if(c==null||c===false) return;
    e.appendChild(typeof c==="object" ? c : document.createTextNode(String(c)));
  });
  return e;
}
function toast(m){ var t=el("div",{class:"toast",text:m,role:"status"}); document.body.appendChild(t); setTimeout(function(){ t.remove(); },2600); }
function pad(n){ return String(n).padStart(2,"0"); }
function stamp(d){ return d ? (d.getMonth()+1)+"/"+d.getDate()+" "+pad(d.getHours())+":"+pad(d.getMinutes()) : ""; }

//@core-begin
/* ============================================================
   資料整理（不碰畫面，可以單獨測）
   ============================================================ */
function blankT(){ return {boys:"", girls:"", per:{M:"",F:""}, use:{}, seatFix:{}, fix:{}, notes:{}, talked:{}, rooms:{M:null,F:null}, avoid:[]}; }
/* "1-13, 15、17" → [1..13,15,17] */
function parseSeats(s){
  var out=[];
  String(s||"").replace(/[０-９]/g,function(d){ return String.fromCharCode(d.charCodeAt(0)-65248); }).split(/[,，、;；\s]+/).forEach(function(x){
    var m=x.match(/^(\d+)\s*[-~～–—－]\s*(\d+)$/);
    if(m){ for(var i=+m[1];i<=+m[2]&&i<=40;i++) if(i>=1&&out.indexOf(i)<0) out.push(i); }
    else if(/^\d+$/.test(x)&&+x>=1&&+x<=40&&out.indexOf(+x)<0) out.push(+x);
  });
  return out.sort(function(a,b){ return a-b; });
}
function parseSizes(s,n,per){
  var a=(String(s||"").match(/\d+/g)||[]).map(Number).filter(function(x){ return x>0&&x<=20; });
  if(a.length||!n) return a;
  var k=Math.ceil(n/per), out=[];
  for(var i=0;i<k;i++) out.push(Math.floor(n/k)+(i<n%k?1:0));
  return out;
}
function sig(s){ return JSON.stringify([s.name,s.sex,s.wn,s.ws,s.kn,s.ks,(s.tags||[]).slice().sort(),s.note,s.mind]); }

/* subs：雲端每一份填答；T：老師的設定。回傳整理好的 {P:{座號:人}, seats:[座號], issues:[]} */
function build(subs,T,cfg){
  var P={}, by={}, boys=parseSeats(T.boys), girls=parseSeats(T.girls), seats;
  subs.forEach(function(s){
    var seat=T.seatFix[s.id]||s.seat;
    (by[seat]=by[seat]||[]).push(s);
  });
  var base = (boys.length||girls.length) ? boys.concat(girls) : Array.from({length:cfg.seats},function(_,i){ return i+1; });
  seats=base.concat(Object.keys(by).map(Number)).filter(function(x,i,a){ return a.indexOf(x)===i; }).sort(function(a,b){ return a-b; });
  seats.forEach(function(n){
    var all=(by[n]||[]).slice().sort(function(a,b){ return (b.at?+b.at:Infinity)-(a.at?+a.at:Infinity); }), seen={}, uniq=[];
    all.forEach(function(s){ var k=sig(s); if(!seen[k]){ seen[k]=1; uniq.push(s); } });
    var cur=uniq.filter(function(s){ return s.id===T.use[n]; })[0]||uniq[0]||null;
    var lst=boys.indexOf(n)>=0?"M":girls.indexOf(n)>=0?"F":"";
    P[n]={seat:n, sub:cur, all:all, uniq:uniq, name:cur?cur.name:"", sex:cur?cur.sex:lst, lstSex:lst, listed:base.indexOf(n)>=0,
      w:[], k:[], inW:[], inK:[], flags:[], nm2:uniq.map(function(s){ return s.name; }).filter(function(x,i,a){ return a.indexOf(x)===i; }).length>1};
  });
  /* 還沒填的人：同學寫志願時如果附了座號，就先借那個名字 */
  var tally={};
  seats.forEach(function(n){
    var s=P[n].sub; if(!s) return;
    s.wn.concat(s.kn).forEach(function(nm,i){
      var st=s.ws.concat(s.ks)[i];
      if(nm&&st&&P[st]&&!P[st].sub){ tally[st]=tally[st]||{}; tally[st][nm]=(tally[st][nm]||0)+1; }
    });
  });
  Object.keys(tally).forEach(function(n){
    P[n].name=Object.keys(tally[n]).sort(function(a,b){ return tally[n][b]-tally[n][a]; })[0]; P[n].guess=true;
    if(!P[n].sex){ var fans=seats.filter(function(m){ var s=P[m].sub; return s&&s.ws.concat(s.ks).indexOf(+n)>=0; }); var sx=fans.map(function(m){ return P[m].sex; }); if(sx.length&&sx.every(function(x){ return x===sx[0]; })) P[n].sexGuess=sx[0]; }
  });
  /* 把每一格志願對到座號 */
  function resolve(me,slot,nm,st){
    var r={slot:slot, n:nm, s:st, to:0, st:"none", cand:[]};
    if(!nm&&!st) return r;
    var f=T.fix[me.sub.id+":"+slot];
    if(f===-1){ r.st="ignored"; return r; }

function groupOf(D,sx){ return D.seats.filter(function(n){ var p=D.P[n]; return (p.sex||p.sexGuess||"")===sx; }); }
function cleanRooms(rooms,G,sizes){
  var seen={};

/* 每個人的志願達成情形：同房的志願序、鄰房的志願序 */
function status(D,rooms){
  var at={}, out={};
  rooms.forEach(function(r,i){ r.forEach(function(n){ at[n]=i; }); });
  Object.keys(at).forEach(function(n){
    var p=D.P[n], o={same:[],next:[],acc:[],has:false};
    p.w.forEach(function(r,i){
      if(!r.to) return; o.has=true;
      if(at[r.to]===undefined) return;
      var d=Math.abs(at[r.to]-at[n]);
      if(d===0) o.same.push(i+1); else if(d===1) o.next.push(i+1);
    });
    p.k.forEach(function(r){ if(r.to&&at[r.to]===at[n]) o.acc.push(r.to); });
    o.lv=!o.has?"none":o.same.length?"same":o.next.length?"next":"miss";
    out[n]=o;

}
function arrange(D,sx,sizes,T,rnd){
  var G=groupOf(D,sx), R=rnd||Math.random, total=sizes.reduce(function(a,b){ return a+b; },0), n=Math.max(total,0);
  if(!G.length||!n) return sizes.map(function(){ return []; });
  var idx={}; G.forEach(function(s,i){ idx[s]=i; });
  var m=G.length, W=[], wl=[], bad=[], i, j;
  for(i=0;i<m;i++){ W.push(new Array(m).fill(0)); wl.push([]); bad.push({}); }
  G.forEach(function(s,a){
    var p=D.P[s];
    p.w.forEach(function(r,k){ if(r.to&&idx[r.to]!==undefined){ W[a][idx[r.to]]+=[10,8,6][k]; wl[a].push(idx[r.to]); } });
    p.k.forEach(function(r){ if(r.to&&idx[r.to]!==undefined) W[a][idx[r.to]]+=3; });
  });
  T.avoid.forEach(function(x){ var a=idx[x[0]], b=idx[x[1]]; if(a!==undefined&&b!==undefined){ bad[a][b]=bad[b][a]=1; } });
  var roomOf=[]; sizes.forEach(function(k,r){ for(var q=0;q<k;q++) roomOf.push(r); });
  function score(S){
    var at=new Array(m).fill(-9), cnt=new Array(sizes.length).fill(0), sc=0, a, b;
    for(var q=0;q<n;q++) if(S[q]>=0){ at[S[q]]=roomOf[q]; cnt[roomOf[q]]++; }
    for(a=0;a<m;a++){
      if(at[a]<0) continue;
      var lv=0;
      for(b=0;b<wl[a].length;b++){ if(at[wl[a][b]]<0) continue; var d=Math.abs(at[wl[a][b]]-at[a]); if(d===0){ lv=2; break; } if(d===1) lv=1; }
      if(wl[a].length) sc+=lv===2?90:lv===1?40:0;
      for(b=0;b<m;b++) if(a!==b&&at[b]===at[a]){ sc+=W[a][b]; if(bad[a][b]) sc-=600; }
    }
    for(q=0;q<cnt.length;q++) if(cnt[q]===1&&sizes[q]>1) sc-=120;
    return sc;
  }
  var best=null, bs=-Infinity;
  for(var t=0;t<36;t++){
    var pool=G.map(function(_,x){ return x; }), S=[];
    for(i=pool.length-1;i>0;i--){ j=Math.floor(R()*(i+1)); var tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
    for(i=0;i<n;i++) S.push(i<pool.length?pool[i]:-1);
    for(i=n-1;i>0;i--){ j=Math.floor(R()*(i+1)); tmp=S[i]; S[i]=S[j]; S[j]=tmp; }
    var cur=score(S), temp=40;
    for(var it=0;it<2200;it++){
      i=Math.floor(R()*n); j=Math.floor(R()*n);
      if(roomOf[i]===roomOf[j]||(S[i]<0&&S[j]<0)) continue;
      tmp=S[i]; S[i]=S[j]; S[j]=tmp;
      var ns=score(S);
      if(ns>=cur||R()<Math.exp((ns-cur)/temp)) cur=ns; else{ tmp=S[i]; S[i]=S[j]; S[j]=tmp; }
      temp=Math.max(.5,temp*.998);
      if(cur>bs){ bs=cur; best=S.slice(); }
    }
  }
  if(!best) best=G.slice(0,n).map(function(_,x){ return x; });
  var out=sizes.map(function(){ return []; });
  best.forEach(function(x,q){ if(x>=0) out[roomOf[q]].push(G[x]); });
  return out.map(function(r){ return r.sort(function(a,b){ return a-b; }); });
}

function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=function(){ rej(new Error(src)); }; document.head.appendChild(s); }); }

function norm(id,d){

  return {id:id, seat:+d.seat||0, name:String(d.name||""), sex:d.sex==="F"?"F":"M", wn:arr(d.wn,3,"").map(String), ws:arr(d.ws,3,0).map(Number), kn:arr(d.kn,2,"").map(String), ks:arr(d.ks,2,0).map(Number),

}

async function start(u){
  TOK=false; T=blankT(); SUBS=[];
  try{
    var s=await DB.collection(CFG.tcol).doc("state").get();
    if(s.exists) T=Object.assign(blankT(),JSON.parse(s.data().json||"{}"));
    TOK=true;
  }catch(e){ if(e&&e.code==="permission-denied"){ denied(u); $("board").hidden=true; return; } note(["讀不到之前的備註和排房，先不會存檔。請重新整理頁面。"]); }
  UNSUB=DB.collection(CFG.col).onSnapshot(function(q){
    SUBS=[]; q.forEach(function(d){ SUBS.push(norm(d.id,d.data())); });
    LASTAT=new Date(); $("board").hidden=false;
    var f=document.activeElement, typing=f&&/^(TEXTAREA|INPUT|SELECT)$/.test(f.tagName)&&$("board").contains(f);
    if(typing){ rebuild(); setSub("有新的填答，離開輸入格就會更新"); f.addEventListener("blur",function(){ setTimeout(render,50); },{once:true}); }
    else render();

async function boot(){
  try{
    var B="https://www.gstatic.com/firebasejs/10.12.2/";

    firebase.initializeApp(CFG.firebase); DB=firebase.firestore(); AUTH=firebase.auth();
  }catch(e){ $("gate").hidden=false; $("err").textContent="載入不到 Firebase 元件，請檢查網路。"; return; }
  AUTH.onAuthStateChanged(function(u){
    $("gate").hidden=!!u; note();
    if(u){ rebuild(); acts(); start(u); }
    else{ if(UNSUB){ UNSUB(); UNSUB=null; } SUBS=[]; T=blankT(); TOK=false; $("board").hidden=true; $("acts").replaceChildren(); $("out").replaceChildren(); if($("dlg").open) $("dlg").close(); $("dlg").replaceChildren(); $("sub").textContent=CFG.cls+"導師"; }
  });
}
