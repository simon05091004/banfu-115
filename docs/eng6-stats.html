<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>英語單字錯誤分析｜永福國小六年級</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E9F0F8; --card:#FFFFFF; --sunk:#F3F7FC;
  --ink:#16243F; --soft:#4E5D7A; --faint:#7C8AA5; --line:#CDD9E9;
  --rule:#9CC0E6; --base:#E39490;
  --pri:#2352B5; --pri-ink:#FFFFFF; --pri-bg:#E2EAFA;
  --ok:#17724A; --ok-bg:#E0F3E8; --bad:#B8352C; --bad-bg:#FBE7E4; --mark:#FFEFA8;
  --s-spell:#2a78d6; --s-mixup:#eb6834; --s-form:#1baf7a; --s-func:#eda100; --s-part:#e87ba4; --s-caps:#008300; --s-other:#9AA5B8;
  --track:#E4EBF5;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111A2B; --card:#1A2640; --sunk:#152036;
  --ink:#E9EFF9; --soft:#AFBDD6; --faint:#8292AF; --line:#324363;
  --rule:#3F6494; --base:#A8605E;
  --pri:#7FA6F5; --pri-ink:#0D1930; --pri-bg:#223559;
  --ok:#74D3A2; --ok-bg:#173529; --bad:#F3938A; --bad-bg:#3D2425; --mark:#5C5016;
  --s-spell:#3987e5; --s-mixup:#d95926; --s-form:#199e70; --s-func:#c98500; --s-part:#d55181; --s-caps:#0ca30c; --s-other:#6E7C96;
  --track:#24324F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111A2B; --card:#1A2640; --sunk:#152036;
  --ink:#E9EFF9; --soft:#AFBDD6; --faint:#8292AF; --line:#324363;
  --rule:#3F6494; --base:#A8605E;
  --pri:#7FA6F5; --pri-ink:#0D1930; --pri-bg:#223559;
  --ok:#74D3A2; --ok-bg:#173529; --bad:#F3938A; --bad-bg:#3D2425; --mark:#5C5016;
  --s-spell:#3987e5; --s-mixup:#d95926; --s-form:#199e70; --s-func:#c98500; --s-part:#d55181; --s-caps:#0ca30c; --s-other:#6E7C96;
  --track:#24324F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Heiti TC",sans-serif; font-size:16px; line-height:1.6}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
button:disabled{opacity:.45; cursor:default}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--pri); outline-offset:2px}
.en{font-family:"Andika","Trebuchet MS","Comic Sans MS",sans-serif}
.app{max-width:1180px; margin:0 auto; padding:0 20px 60px}
h1,h2,h3{margin:0; text-wrap:balance}
.bar{display:flex; align-items:center; gap:12px; padding:18px 0 14px; flex-wrap:wrap}
.logo{position:relative; width:52px; height:40px; flex:none; background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.logo i{position:absolute; left:0; right:0; height:1px; background:var(--rule)}
.logo i:nth-child(1){top:7px}.logo i:nth-child(2){top:16px}.logo i:nth-child(3){top:27px; background:var(--base)}.logo i:nth-child(4){top:34px}
.logo b{position:absolute; inset:0 0 auto; text-align:center; font:700 24px/39px "Andika","Trebuchet MS",sans-serif; color:var(--pri)}
.brand{margin-right:auto}
.brand h1{font-size:24px; font-weight:900; line-height:1.3}
.brand p{margin:0; color:var(--soft); font-size:14px}
.acts{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--card); border-radius:10px; min-height:42px; padding:6px 16px; font-weight:700; font-size:15px}
.btn.pri{background:var(--pri); border-color:var(--pri); color:var(--pri-ink)}
.btn[aria-pressed="true"]{background:var(--pri-bg); border-color:var(--pri); color:var(--pri)}
.note{border-radius:10px; padding:10px 16px; margin:0 0 14px; background:var(--mark); font-weight:700}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px}
.card h2{font-size:19px; font-weight:900}
.card .sub{color:var(--soft); font-size:14px; margin:2px 0 16px}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; background:var(--bg); padding:8px 0}
@media (min-width:900px){ .filters{position:sticky; top:0; z-index:5} }
.filters select,.filters input{border:1px solid var(--line); background:var(--card); border-radius:10px; min-height:44px; padding:4px 12px; font-size:15px}
.filters input{flex:1 1 180px; min-width:150px}
.kpis{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-bottom:16px}
.kpi .l{font-size:14px; color:var(--soft); font-weight:700}
.kpi .v{font-size:38px; font-weight:900; line-height:1.25; overflow-wrap:anywhere}
.kpi .v.t{font-size:27px; padding:7px 0 4px}
.kpi .n{font-size:14px; color:var(--soft)}
.two{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr)); margin-bottom:16px}
.one{margin-bottom:16px}

.ty{display:block; width:100%; text-align:left; background:none; border:1px solid transparent; border-radius:10px; padding:9px 12px; margin:0 -12px; width:calc(100% + 24px)}
.ty:hover{background:var(--sunk)}
.ty[aria-pressed="true"]{border-color:var(--pri); background:var(--pri-bg)}
.ty .h{display:flex; align-items:baseline; gap:9px}
.ty .h b{margin-right:auto}
.ty .h span{font-variant-numeric:tabular-nums}
.ty .h .p{color:var(--soft); width:3.6em; text-align:right}
.sw{width:12px; height:12px; border-radius:3px; flex:none; align-self:center}
.hbar{height:10px; border-radius:4px; background:var(--track); margin:6px 0 4px}
.hbar i{display:block; height:100%; border-radius:0 4px 4px 0; min-width:2px}
.ty .ex{font-size:14px; color:var(--soft)}
.legend{display:flex; gap:6px 16px; flex-wrap:wrap; font-size:14px; color:var(--soft); margin-bottom:12px}
.legend span{display:inline-flex; gap:7px; align-items:center}
.st{margin-bottom:16px}
.st .h{display:flex; justify-content:space-between; gap:10px; margin-bottom:5px}
.st .h span{color:var(--soft); font-variant-numeric:tabular-nums; white-space:nowrap}
.stack{display:flex; gap:2px; height:22px}
.stack button{border:0; padding:0; height:100%; min-width:3px; border-radius:0; cursor:default}
.stack button:last-child{border-radius:0 4px 4px 0}
.stack button:hover{filter:brightness(1.12)}
.top{display:grid; gap:4px}
.tp{display:grid; grid-template-columns:30px minmax(130px,auto) 1fr auto; gap:4px 12px; align-items:center; width:calc(100% + 24px); margin:0 -12px; text-align:left; border:0; background:none; border-radius:10px; padding:9px 12px}
button.tp:hover{background:var(--sunk)}
.tp .r{color:var(--faint); font-weight:700; font-variant-numeric:tabular-nums}
.tp .w{font-size:20px; font-weight:700}
.tp .w small{font:500 14px/1.4 "Noto Sans TC",sans-serif; color:var(--soft); margin-left:8px}
.tp .ms{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--sunk); border-radius:7px; padding:1px 9px; font-size:15px; white-space:nowrap}
.chip em{font:500 13px/1 "Noto Sans TC",sans-serif; color:var(--soft); margin-left:5px}
.tp .n{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.tp .stack{grid-column:2/-1; height:10px}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
th{font-size:13px; color:var(--soft); white-space:nowrap}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.scroll{overflow-x:auto; margin:0 -6px}
.meter{height:8px; border-radius:4px; background:var(--track); min-width:90px}
.meter i{display:block; height:100%; border-radius:4px; background:var(--pri)}
td .miss{color:var(--bad); font-weight:700}
.seats{display:grid; gap:6px; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); margin-top:14px}
.seat{border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:14px; line-height:1.4; background:var(--sunk); color:var(--faint)}
.seat b{display:block; font-size:16px; color:var(--ink)}
.seat.on{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.pager{display:flex; gap:10px; align-items:center; justify-content:flex-end; margin-top:12px; font-size:14px; color:var(--soft)}
details{margin-top:12px; font-size:15px}
summary{cursor:pointer; color:var(--pri); font-weight:500}
.empty{color:var(--soft); padding:18px 0}
.tip{position:fixed; z-index:60; pointer-events:none; background:var(--ink); color:var(--card); border-radius:8px; padding:6px 12px; font-size:14px; max-width:260px}
.tip b{display:block; font-size:16px}
.gate{max-width:440px; margin:40px auto}
.gate label{display:block; font-weight:700; margin:14px 0 4px}
.gate input{width:100%; border:1px solid var(--line); background:var(--sunk); border-radius:10px; min-height:48px; padding:6px 14px}
.err{color:var(--bad); font-weight:700; min-height:1.6em; margin:10px 0}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:var(--card); padding:11px 22px; border-radius:10px; font-weight:700; z-index:70; max-width:90vw}
dialog{border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); padding:24px; max-width:460px}
dialog::backdrop{background:rgba(10,18,36,.5)}
dialog p{margin:10px 0 18px; color:var(--soft)}

/* 投影檢討 */
.rv{position:fixed; inset:0; z-index:50; background:var(--bg); display:grid; grid-template-rows:auto 1fr auto; padding:22px clamp(20px,5vw,72px)}
.rv header,.rv footer{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.rv header{font-size:20px; font-weight:700; color:var(--soft)}
.rv .stage{overflow:auto; display:grid; align-content:safe center; gap:clamp(16px,3vh,34px); padding:16px 0}
.rv .s{font-size:clamp(28px,4.2vw,56px); line-height:1.4; margin:0; text-wrap:pretty}
.rv .gap{border-bottom:4px solid var(--base); color:var(--pri); padding:0 .25em; letter-spacing:.08em; white-space:nowrap}
.rv .gap.done{background:var(--mark); color:var(--ink); border-radius:6px; letter-spacing:0; border-bottom:0; font-weight:700}
.rv .q{font-size:clamp(18px,1.9vw,26px); font-weight:700; color:var(--soft); margin:0}
.rv .wr{display:flex; gap:14px; flex-wrap:wrap}
.rv .wr div{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 22px; font-size:clamp(26px,3vw,42px)}
.rv .wr div em{font:500 16px/1.3 "Noto Sans TC",sans-serif; color:var(--soft); display:block}
.rv s{text-decoration:none; display:inline-block; border-radius:5px; padding:0 1px; min-width:.5em; text-align:center}
.rv s.x{background:var(--bad); color:var(--card)}
.rv s.o{box-shadow:inset 0 -4px 0 var(--bad); color:var(--faint); border-radius:0}
.rv .rev{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 26px; font-size:clamp(20px,2.1vw,30px)}
.rv .rev b{font-size:1.5em; margin-right:14px}
.rv .btn{min-height:54px; padding:8px 26px; font-size:19px}
@media (max-width:560px){
  .app{padding:0 14px 50px}
  .card{padding:16px}
  .tp{grid-template-columns:24px 1fr auto}
  .tp .ms{grid-column:2/-1; grid-row:2}
  .tp .stack{grid-row:3}
}
@media print{ .acts,.filters,.pager,details,#detail,.logo{display:none !important} body{background:#fff} .card{break-inside:avoid} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><b>Aa</b></div>
    <div class="brand"><h1>英語單字錯誤分析</h1><p id="sub"></p></div>
    <div class="acts" id="acts"></div>
  </header>
  <div id="note"></div>
  <section id="gate" class="card gate" hidden>
    <h2>老師登入</h2>
    <p class="sub">用其他檢核頁同一組老師帳號。</p>
    <label for="em">帳號</label><input id="em" type="email" autocomplete="username">
    <label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="err" role="alert"></p>
    <button class="btn pri" id="signin">登入</button>
  </section>
  <main id="board" hidden>
    <div class="filters" id="filters"></div>
    <div id="out"></div>
  </main>
</div>
<div class="tip" id="tip" hidden></div>

<script src="eng6-bank.js?v=11240842"></script>
<script src="eng6-core.js?v=11240842"></script>
<script>
"use strict";
var E=ENG6, C=ENGC, el=C.el, $=function(i){ return document.getElementById(i); };
var MODE = /[?&]demo/.test(location.search) ? "demo" : /[?&]pub/.test(location.search) ? "pub" : "teacher";
var DB=null, AUTH=null, ROWS=[], ROUNDS=[], F={when:"all",cls:"",unit:"",part:"",lv:"",type:"",q:""}, ANON=MODE!=="teacher", PAGE=0, PER=30;
var COLOR={}; C.TYPES.forEach(function(t){ COLOR[t.k]="var(--s-"+t.k+")"; });
var CLS=Object.keys(E.classes);

function toast(m){ var t=el("div",{class:"toast",text:m,role:"status"}); document.body.appendChild(t); setTimeout(function(){ t.remove(); },2600); }
function pct(a,b){ return b ? (a/b*100).toFixed(1)+"%" : "0%"; }
function stamp(ts){ var d=new Date(ts); if(isNaN(d)) return ""; var p=function(n){ return String(n).padStart(2,"0"); };
  return p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }

/* ---------- 資料整理 ---------- */
function flatten(docs){
  ROUNDS=[]; ROWS=[];
  docs.forEach(function(d){
    if(!d || !has(E.classes,d.cls) || !(d.seat>=1) || !Array.isArray(d.detail)) return;
    var r={cls:d.cls, seat:Number(d.seat), ts:String(d.ts||""), n:0, ok:0};
    d.detail.forEach(function(x){
      var q=x && C.byId[x.id];
      if(!q) return;                       /* 換過題庫，舊題目就不算進來 */
      var u=C.norm(x.u).slice(0,40), ok=!!x.ok, c=ok?null:C.classify(q.a,u);
      ROWS.push({ts:r.ts, cls:r.cls, seat:r.seat, q:q, u:u, ok:ok, t:ok?"":(c.ok?"caps":c.t), d:ok?"":c.d, r:!!x.r, h:Number(x.h)||0, lv:Number(x.lv)||3});
      r.n++; if(ok) r.ok++;
    });
    if(r.n) ROUNDS.push(r);
  });
  ROWS.sort(function(a,b){ return b.ts.localeCompare(a.ts); });
}
function has(o,k){ return Object.prototype.hasOwnProperty.call(o,k); }
function inWhen(ts){
  if(F.when==="all") return true;
  var d=new Date(ts), n=new Date();
  if(F.when==="today") return d.toDateString()===n.toDateString();
  return n-d < Number(F.when)*864e5;
}
function scope(skipType){
  var s=F.q.trim().toLowerCase();
  return ROWS.filter(function(r){
    return inWhen(r.ts) && (!F.cls||r.cls===F.cls) && (!F.unit||r.q.u===F.unit) && (!F.part||r.q.g===F.part) && (!F.lv||r.lv===Number(F.lv))
      && (!s || r.q.a.toLowerCase().indexOf(s)>=0 || r.u.toLowerCase().indexOf(s)>=0 || r.q.zh.indexOf(s)>=0)
      && (skipType || !F.type || r.ok || r.t===F.type);
  });
}
function countBy(rows,f){ var o={}; rows.forEach(function(r){ var k=f(r); o[k]=(o[k]||0)+1; }); return o; }
function sorted(o){ return Object.keys(o).map(function(k){ return [k,o[k]]; }).sort(function(a,b){ return b[1]-a[1] || (a[0]<b[0]?-1:1); }); }
function summarize(rows){
  var bad=rows.filter(function(r){ return !r.ok; }), units={}, words={}, ways={};
  rows.forEach(function(r){ var w=ways[r.lv]=ways[r.lv]||{n:0,ok:0}; w.n++; if(r.ok) w.ok++; });
  E.units.forEach(function(u){ units[u.id]={}; });
  bad.forEach(function(r){
    units[r.q.u][r.t]=(units[r.q.u][r.t]||0)+1;
    var w=words[r.q.id]=words[r.q.id]||{id:r.q.id,n:0,types:{},bad:{}};
    w.n++; w.types[r.t]=(w.types[r.t]||0)+1; if(r.u) w.bad[r.u]=(w.bad[r.u]||0)+1;
  });
  return {total:rows.length, bad:bad.length, types:countBy(bad,function(r){ return r.t; }), units:units, ways:ways,
    top:Object.keys(words).map(function(k){ return words[k]; }).sort(function(a,b){ return b.n-a.n || (a.id<b.id?-1:1); })
      .map(function(w){ return {id:w.id,n:w.n,types:w.types,bad:sorted(w.bad)}; }),
    words:Object.keys(words).length};
}

/* ---------- 提示框 ---------- */
function tipOn(node, strong, soft){
  function on(e){
    var t=$("tip"); t.replaceChildren(el("b",{text:strong}), document.createTextNode(soft)); t.hidden=false;
    var b=node.getBoundingClientRect(), x=(e&&e.clientX)||b.left+b.width/2, w=t.offsetWidth;
    t.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+"px";
    t.style.top=(b.top-t.offsetHeight-8<4 ? b.bottom+8 : b.top-t.offsetHeight-8)+"px";
  }
  node.onpointermove=on; node.onpointerenter=on; node.onfocus=on;
  node.onpointerleave=node.onblur=function(){ $("tip").hidden=true; };
}
function stack(types, scaleTo, name){
  var s=el("div",{class:"stack"});
  C.TYPES.forEach(function(t){
    var n=types[t.k]; if(!n) return;
    var b=el("button",{type:"button","aria-label":name+"，"+t.n+" "+n+" 筆",style:"background:"+COLOR[t.k]+";flex:0 0 calc("+(n/scaleTo*100)+"% - 2px)"});
    tipOn(b, n+" 筆", t.n+"・"+name); s.appendChild(b);
  });
  return s;
}
function legend(types){
  return el("div",{class:"legend"},C.TYPES.filter(function(t){ return types[t.k]; }).map(function(t){
    return el("span",null,[el("i",{class:"sw",style:"background:"+COLOR[t.k]}), t.n]); }));
}

/* ---------- 篩選 ---------- */
function buildFilters(){
  var box=$("filters"); box.replaceChildren();
  function sel(key,label,opts){
    var s=el("select",{"aria-label":label,onchange:function(){ F[key]=s.value; PAGE=0; render(); }},
      opts.map(function(o){ return el("option",{value:o[0],text:o[1],selected:F[key]===o[0]}); }));
    box.appendChild(s); return s;
  }
  sel("when","期間",[["all","全部期間"],["today","今天"],["7","最近 7 天"],["30","最近 30 天"]]);
  sel("cls","班級",[["","所有班級"]].concat(CLS.map(function(c){ return [c,c+" 班"]; })));
  sel("unit","單元",[["","所有單元"]].concat(E.units.map(function(u){ return [u.id,u.zh]; })));
  sel("part","部分",[["","單字＋發音＋句型"]].concat(E.parts.map(function(x){ return [x.id,x.zh]; })));
  sel("lv","作答方式",[["","所有作答方式"],["1","選一選"],["2","排字母"],["3","自己拼"]]);
  sel("type","錯誤類型",[["","所有錯誤類型"]].concat(C.TYPES.map(function(t){ return [t.k,t.n]; })));
  var tm; box.appendChild(el("input",{type:"search",placeholder:"找單字、學生的寫法、中文","aria-label":"搜尋",value:F.q,oninput:function(){
    var v=this.value; clearTimeout(tm); tm=setTimeout(function(){ F.q=v; PAGE=0; render(); },180); }}));
}

/* ---------- 畫面 ---------- */
function kpi(l,v,n,text){ return el("div",{class:"card kpi"},[el("div",{class:"l",text:l}), el("div",{class:"v"+(text?" t":"")+(text==="en"?" en":""),text:v}), el("div",{class:"n",text:n})]); }

function charts(S, opt){
  var out=[], tops=sorted(S.types), t0=tops[0], w0=S.top[0];
  out.push(el("div",{class:"kpis"},[
