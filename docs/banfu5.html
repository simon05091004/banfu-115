<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五年級班服共編</title>
<meta name="description" content="各班選色（一色一班，撞色抽籤）、上傳圖案、線上試衣間、尺寸數量統計，廠商據以線上報價">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf8f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}
:root{
  --paper:#faf8f4; --card:#ffffff; --sunk:#f4f1ea;
  --ink:#1e1c19; --dim:#6d675e; --faint:#989185;
  --line:#e4dfd5; --hair:#efebe2; --hatch:#eae6dc;
  --a1:#a1670f; --a1-bg:#fbf3e2; --a1-ln:#e6d3a8;
  --a2:#1d5ba4; --a2-bg:#edf3fc; --a2-ln:#c3d7f0;
  --a3:#1c7549; --a3-bg:#eaf6ef; --a3-ln:#b5dcc4;
  --a4:#7a3f8c; --a4-bg:#f8eefb; --a4-ln:#e0c6e8;
  --warn:#9c3412; --warn-bg:#fbeee7; --warn-ln:#eccdbd;
  --focus:#1d5ba4;
  --sh:0 1px 2px rgba(40,32,18,.05), 0 6px 18px -10px rgba(40,32,18,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1a1815; --card:#232019; --sunk:#1f1c17;
    --ink:#ece6dc; --dim:#a09789; --faint:#7b7366;
    --line:#35312a; --hair:#2b2822; --hatch:#26231d;
    --a1:#e3a943; --a1-bg:#332a17; --a1-ln:#584825;
    --a2:#7db0ef; --a2-bg:#1a2634; --a2-ln:#2e4864;
    --a3:#5ec68e; --a3-bg:#172b20; --a3-ln:#2b543e;
    --a4:#cb99dc; --a4-bg:#2b1f31; --a4-ln:#4a3553;
    --warn:#f0a184; --warn-bg:#33211a; --warn-ln:#5c3626;
    --focus:#7db0ef;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#1a1815; --card:#232019; --sunk:#1f1c17;
  --ink:#ece6dc; --dim:#a09789; --faint:#7b7366;
  --line:#35312a; --hair:#2b2822; --hatch:#26231d;
  --a1:#e3a943; --a1-bg:#332a17; --a1-ln:#584825;
  --a2:#7db0ef; --a2-bg:#1a2634; --a2-ln:#2e4864;
  --a3:#5ec68e; --a3-bg:#172b20; --a3-ln:#2b543e;
  --a4:#cb99dc; --a4-bg:#2b1f31; --a4-ln:#4a3553;
  --warn:#f0a184; --warn-bg:#33211a; --warn-ln:#5c3626;
  --focus:#7db0ef;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.65 "Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
}
.wrap{max-width:1040px;margin:0 auto;padding:36px 18px 72px;display:flex;flex-direction:column;gap:28px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{margin:0;font-size:12.5px;letter-spacing:.14em;color:var(--dim);font-weight:500}
h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(25px,4.4vw,34px);
  line-height:1.3;letter-spacing:.01em;text-wrap:balance}
.lede{margin:2px 0 0;color:var(--dim);font-size:15px;max-width:64ch}
.role{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:600;
  letter-spacing:.08em;padding:3px 11px;border-radius:999px;border:1px solid currentColor;margin-bottom:2px}
.role.r1{color:var(--a2)} .role.r2{color:var(--a1)} .role.r3{color:var(--a4)}
.syncbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--a3);flex:0 0 auto}
.dot.local{background:var(--a1)} .dot.bad{background:var(--warn)}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.panel-hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 20px 0}
.panel-bd{padding:16px 20px 20px;display:flex;flex-direction:column;gap:15px}
h2{margin:0;font-family:"Noto Serif TC",serif;font-weight:600;font-size:19px;letter-spacing:.01em}
h3{margin:0;font-size:14px;font-weight:600}
.kicker{font-size:11.5px;letter-spacing:.16em;color:var(--dim);font-weight:600;text-transform:uppercase}
.hint{margin:0;font-size:13.5px;color:var(--dim)}
.tally{margin-left:auto;font-size:13px;color:var(--dim)}
.tally b{color:var(--ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
input[type=text],input[type=number],select,textarea{
  font:inherit;font-size:15px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input[disabled],select[disabled],textarea[disabled]{opacity:.5}

/* ---------- 班級選擇 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:8px 12px 7px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;min-width:66px;transition:border-color .12s,background .12s,transform .08s}
.chip:hover{border-color:var(--dim)}
.chip:active{transform:translateY(1px)}
.chip .cn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.chip .pip{width:16px;height:6px;border-radius:3px;background:var(--line);border:1px solid var(--hair)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- 色票 + 名額 ---------- */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.sw{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0;
  cursor:pointer;overflow:hidden;display:flex;flex-direction:column;text-align:center;
  transition:border-color .12s,transform .08s}
.sw:hover{border-color:var(--dim)} .sw:active{transform:translateY(1px)}
.sw i{display:block;height:46px;border-bottom:1px solid var(--hair);position:relative}
.sw b{display:block;font-size:12.5px;font-weight:600;padding:6px 4px 1px;color:var(--ink);line-height:1.3}
.sw u{display:block;font-size:11px;text-decoration:none;color:var(--dim);padding:0 4px 3px;line-height:1.35}
.sw .seats{display:flex;gap:3px;justify-content:center;padding:0 0 7px}
.sw .seats s{width:13px;height:5px;border-radius:3px;background:var(--hatch);text-decoration:none;display:block}
.sw .seats s.take{background:var(--ink)}
.sw .seats s.mine{background:var(--a2)}
.sw .seats s.wait{background:var(--a1)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sw[disabled]{opacity:.42;cursor:not-allowed}
.sw[disabled] b{text-decoration:line-through}
.sw.full i::after{content:"已定案";position:absolute;inset:auto 0 0 0;font-size:10.5px;font-weight:700;
  background:rgba(30,28,25,.72);color:#fff;padding:1px 0;letter-spacing:.1em}

/* ---------- 試衣間 ---------- */
.fitroom{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fit{background:var(--sunk);border:1px solid var(--hair);border-radius:14px;padding:10px 10px 6px;
  display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:border-color .12s}
.fit.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fit svg{display:block;width:100%;height:auto}
.fit figcaption{font-size:12px;color:var(--dim);text-align:center;padding-bottom:4px;font-weight:600}
.fit .drop{border:1px dashed var(--line);border-radius:9px;font-size:12px;color:var(--faint);
  text-align:center;padding:5px 4px;margin-top:2px}
.slider{display:grid;grid-template-columns:64px 1fr 46px;align-items:center;gap:9px;font-size:13px;color:var(--dim)}
.slider input[type=range]{width:100%;accent-color:var(--focus)}
.slider output{font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;background:var(--card);border:0;border-right:1px solid var(--line);
  font:inherit;font-size:13.5px;padding:7px 14px;color:var(--dim);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.presets{display:flex;flex-wrap:wrap;gap:7px}
.pbtn{appearance:none;background:var(--card);border:1px solid var(--line);border-radius:999px;
  font:inherit;font-size:12.5px;padding:5px 12px;color:var(--dim);cursor:pointer}
.pbtn:hover{border-color:var(--dim);color:var(--ink)}

/* ---------- 尺寸 ---------- */
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:9px}
.size{background:var(--sunk);border:1px solid var(--hair);border-radius:12px;padding:8px 8px 9px;
  display:flex;flex-direction:column;gap:5px;align-items:center}
.size span{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;letter-spacing:.04em}
.size em{font-style:normal;font-size:10.5px;color:var(--faint);line-height:1.3;text-align:center}
.size input{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:16px;padding:6px 4px}
.sizesum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--dim)}
.sizesum b{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--ink);font-weight:600}

/* ---------- 色卡牆 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--card);
  display:flex;flex-direction:column}
.card.empty{border-style:dashed;background:var(--sunk)}
.card.mineHi{box-shadow:inset 0 0 0 2px var(--a2)}
.card .band{height:9px}
.card .sh{background:var(--sunk);border-bottom:1px solid var(--hair);padding:4px 8px 0}
.card .sh svg{display:block;width:100%;height:auto}
.card .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.card .cn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.card .nm{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:5px}
.card .hx{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
.card .qty{font-size:12px;color:var(--dim)}
.card .qty b{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-size:14px}
.card .none{color:var(--faint);font-size:12.5px;padding:14px 0;text-align:center}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 7px;
  border-radius:999px;border:1px solid currentColor;align-self:flex-start}
.badge.ok{color:var(--a3)} .badge.wait{color:var(--a1)} .badge.out{color:var(--warn)} .badge.won{color:var(--a4)}

/* ---------- 表格 ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{border:1px solid var(--hair);padding:7px 9px;text-align:center;vertical-align:middle}
th{background:var(--sunk);font-weight:600;font-size:12.5px;color:var(--dim);white-space:nowrap}
td.l,th.l{text-align:left}
tr.sum td{background:var(--sunk);font-weight:700}
td em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.none{color:var(--faint)}
td .sq{display:inline-block;width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.15);
  vertical-align:-3px;margin-right:6px}
table input{padding:5px 6px;font-size:14px;text-align:center;font-family:"IBM Plex Mono",monospace;min-width:66px}

/* ---------- 提醒條 ---------- */
.flags{display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.55;
  border:1px solid var(--hair);background:var(--sunk);border-radius:11px;padding:9px 12px;color:var(--dim)}
.flag b{color:var(--ink);font-weight:600}
.flag.warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn)}
.flag.warn b{color:var(--warn)}
.flag.good{background:var(--a3-bg);border-color:var(--a3-ln);color:var(--a3)}
.flag.good b{color:var(--a3)}
.flag.note{background:var(--a1-bg);border-color:var(--a1-ln);color:var(--a1)}
.flag.note b{color:var(--a1)}
.dabs{display:inline-flex;gap:3px;flex:0 0 auto;padding-top:4px}
.dabs i{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.18);display:block}

/* ---------- 抽籤 ---------- */
.draws{display:flex;flex-direction:column;gap:12px}
.draw{border:1px solid var(--a1-ln);background:var(--a1-bg);border-radius:13px;padding:12px 14px;
  display:flex;flex-direction:column;gap:9px}
.draw .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.draw .hd i{width:26px;height:26px;border-radius:8px;border:1px solid rgba(0,0,0,.2);flex:0 0 auto}
.draw .hd b{font-size:15px}
.draw .hd .hx{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim)}
.draw .who{font-size:13.5px;color:var(--dim);line-height:1.7}
.draw .who b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.reel{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;letter-spacing:.08em;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center}
.log{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--dim)}
.logrow{display:flex;gap:9px;align-items:flex-start;border-top:1px dashed var(--hair);padding-top:7px;flex-wrap:wrap}
.logrow:first-child{border-top:0;padding-top:0}
.logrow i{width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.18);flex:0 0 auto;margin-top:4px}
.logrow b{color:var(--ink)}
.logrow .seed{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint)}

/* ---------- 報價 ---------- */
.money{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.total{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:baseline;background:var(--sunk);
  border:1px solid var(--hair);border-radius:12px;padding:12px 15px}
.total div{display:flex;flex-direction:column;gap:1px}
.total span{font-size:12px;color:var(--dim)}
.total b{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600}

/* ---------- 按鈕 / toast ---------- */
.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding-top:2px}
.btn{appearance:none;font:inherit;font-size:14.5px;font-weight:600;border-radius:11px;padding:10px 17px;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;
  transition:opacity .12s,transform .08s}
.btn:hover{opacity:.88} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--dim)}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--warn);opacity:.75}
.btn.danger:hover{opacity:1}
.btn.sm{font-size:13px;padding:7px 13px;border-radius:9px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.sw:focus-visible,.pbtn:focus-visible,.seg button:focus-visible,.fit:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);z-index:50;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:11px;font-size:14px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:min(88vw,460px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#lightbox{position:fixed;inset:0;z-index:60;background:rgba(20,17,12,.86);display:none;place-items:center;padding:24px;cursor:zoom-out}
#lightbox.show{display:grid}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px -20px #000}
footer{color:var(--faint);font-size:12.5px;text-align:center;line-height:1.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  .wrap{padding:24px 12px 60px;gap:22px}
  .panel-hd{padding:15px 14px 0} .panel-bd{padding:13px 14px 16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .swatches{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .slider{grid-template-columns:54px 1fr 40px;gap:7px}
}
@media print{
  body{background:#fff}
  .panel{box-shadow:none;break-inside:avoid;border-color:#ccc}
  .noprint,.actions,#toast,#lightbox{display:none!important}
  .wrap{max-width:none;padding:0;gap:14px}
  .card,.draw{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="role" id="hdRole"></span>
    <p class="eyebrow" id="hdEyebrow"></p>
    <h1 id="hdTitle"></h1>
    <p class="lede" id="hdLede"></p>
    <div class="syncbar"><span class="dot" id="syncDot"></span><span id="syncText">載入中…</span></div>
  </header>

  <!-- ── 班級端：選班級 ───────────────────────────────── -->
  <section class="panel noprint" data-view="class" id="panelWho">
    <div class="panel-hd"><span class="kicker">第一步</span><h2>選擇你的班級</h2>
      <span class="tally" id="whoTally"></span></div>
    <div class="panel-bd">
      <div class="chips" id="classChips"></div>
      <p class="hint" id="whoHint"></p>
    </div>
  </section>

  <!-- ── 班級端：選色 ─────────────────────────────────── -->
  <section class="panel" data-view="class" id="panelColor">
    <div class="panel-hd"><span class="kicker">第二步</span><h2>選一個班服顏色</h2>
      <span class="tally" id="colorTally"></span></div>
    <div class="panel-bd">
      <div class="flags" id="colorFlags"></div>
      <div class="swatches" id="swatches"></div>
      <p class="hint" id="colorHint"></p>
    </div>
  </section>

  <!-- ── 班級端：款式與圖案 ───────────────────────────── -->
  <section class="panel" data-view="class" id="panelDesign">
    <div class="panel-hd"><span class="kicker">第三步</span><h2>款式、圖案與線上試衣間</h2></div>
    <div class="panel-bd">

      <div class="grid2">
        <div class="field">
          <label for="fSleeve">袖長</label>
          <select id="fSleeve"></select>
        </div>
        <div class="field">
          <label for="fNeck">領型</label>
          <select id="fNeck"></select>
        </div>
        <div class="field">
          <label>領口與袖口配色</label>
          <div class="presets" id="trims"></div>
        </div>
      </div>

      <div class="field">
        <label>上傳設計圖案<span class="hint" style="font-weight:400">　去背 PNG 會保留透明背景；正面、背面可以分開上傳</span></label>
        <div class="actions" style="padding-top:0">
          <button class="btn ghost sm" id="btnArtFront" type="button">上傳正面圖案</button>
          <input type="file" id="fArtFront" accept="image/*" style="display:none">
          <button class="btn ghost sm" id="btnArtBack" type="button">上傳背面圖案</button>
          <input type="file" id="fArtBack" accept="image/*" style="display:none">
          <button class="btn ghost sm" id="btnArtClear" type="button">移除這一面的圖案</button>
        </div>
        <p class="hint" id="artHint"></p>

<script>
"use strict";

/* ============================================================

   班級、色票、款式、尺寸表都由此推導，不必動 HTML
   ============================================================ */
const CFG = {
  school: "永福國小",
  term: "115 學年度",
  grade: "五年級",
  title: "五年級班服共編",
  shareTitle: "五年級班服共編入口",

  contact: "學務處",
  classes: ["501","502","503","504","505","506","507","508","509","510","511"],
  perColor: 1,        /* 一個顏色最後能留幾個班 */
  freeSeats: 0,       /* 不必抽籤就確定的席次。0＝只要有兩個班以上想要同一色就抽籤 */
  sleeves: ["短袖","長袖"],
  necks: ["圓領","V 領","POLO 領"],
  trims: [
    {name:"同主色", hex:""},

  ],
  palette: [
    {name:"丈青",   hex:"#1F3864"},
    {name:"寶藍",   hex:"#1155CC"},
    {name:"天藍",   hex:"#4FA8E0"},
    {name:"湖水綠", hex:"#2FA98C"},
    {name:"墨綠",   hex:"#17603F"},
    {name:"草綠",   hex:"#5FA82B"},
    {name:"螢光綠", hex:"#B6E42B"},
    {name:"檸檬黃", hex:"#F2D024"},
    {name:"螢光橘", hex:"#FF7A1A"},
    {name:"磚紅",   hex:"#A93226"},
    {name:"正紅",   hex:"#D32027"},
    {name:"桃紅",   hex:"#E24A8B"},
    {name:"藕紫",   hex:"#7A3F8C"},
    {name:"卡其",   hex:"#C2A878"},
    {name:"淺灰",   hex:"#C9CCCF"},
    {name:"深灰",   hex:"#4A4F55"},
    {name:"黑",     hex:"#1E1E1E"},
    {name:"白",     hex:"#FFFFFF"}
  ],
  sizes: ["XS","S","M","L","XL","XXL"],
  bigSizes: ["XL","XXL"],   /* 廠商加價的尺寸 */
  sizeChart: [

    {size:"S",   chest:41, len:61},
    {size:"M",   chest:44, len:66},
    {size:"L",   chest:47, len:70},
    {size:"XL",  chest:50, len:74},
    {size:"XXL", chest:53, len:77}
  ],
  nearThreshold: 12
};

/* 檢視：?v=class（各班，預設）／?v=admin（承辦）／?v=vendor（廠商） */
const VIEWS = {
  class:  {key:"class",  role:"各班填寫", cls:"r1",
           lede:"點自己的班級，登記一個顏色，上傳圖案看試衣間效果，再填各尺寸件數。一個顏色只留一個班，兩班以上想要就抽籤決定。"},
  admin:  {key:"admin",  role:"承辦檢視", cls:"r2",
           lede:"全校選色狀況、同色撞色抽籤、尺寸總表與廠商比價。除了主持抽籤，此檢視不會更動各班填的內容。"},
  vendor: {key:"vendor", role:"廠商 · 線上報價", cls:"r3",
           lede:"各班的顏色、款式、設計圖案與各尺寸件數都在這裡，可直接在線上填單價與版費，系統即時算出小計與總價。"}
};
const VIEW = (() => {
  const q = (new URLSearchParams(location.search).get("v") || "").toLowerCase();
  if(q === "admin" || q === "check" || q === "xue") return VIEWS.admin;
  if(q === "vendor" || q === "v" || q === "price") return VIEWS.vendor;
  return VIEWS.class;
})();

const LS_KEY = "yfes-banfu5-115-5";
const LS_ME  = "yfes-banfu5-115-5-me";
const LS_ART = "yfes-banfu5-115-5-art";
const LS_VD  = "yfes-banfu5-115-5-vendor";

/* ============================================================
   狀態
   ============================================================ */
let state = {classes:{}, draws:[], quotes:{}, updated:null};
let me = null;                 /* 班級端目前身分 */
let draft = null;              /* 班級端草稿 */
let face = "front";            /* 試衣間目前調整哪一面 */
let vendorKey = null;          /* 廠商端目前身分 */
const ART = {};                /* 圖案快取 "501:front" -> {thumb, full, at} */
const ARTing = {};             /* 正在抓的圖案，避免重複請求 */

const meta = cls => state.classes[cls] || null;
const filled = () => CFG.classes.filter(c => meta(c));
const missing = () => CFG.classes.filter(c => !meta(c));
const artKey = (cls, f) => cls + ":" + f;

/* ---------- 顏色 ---------- */
function normHex(s){
  if(!s) return null;
  const t = String(s).trim().replace(/^#?/, "#").toUpperCase();
  if(/^#[0-9A-F]{3}$/.test(t)) return "#" + t[1] + t[1] + t[2] + t[2] + t[3] + t[3];
  return /^#[0-9A-F]{6}$/.test(t) ? t : null;
}
const sameHex = (a, b) => !!a && !!b && normHex(a) === normHex(b);
function rgb(hex){
  const h = normHex(hex) || "#000000";
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
/** 依背景亮度挑字色，確保色塊上的字讀得到 */
function onColor(hex){
  const [r,g,b] = rgb(hex).map(v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); });
  return (.2126*r + .7152*g + .0722*b) > .42 ? "#1e1c19" : "#ffffff";
}
/** 往黑（amt>0）或往白（amt<0）調，用來畫領口內裡與陰影 */
function shade(hex, amt){
  const c = rgb(hex).map(v => amt >= 0 ? Math.round(v * (1 - amt)) : Math.round(v + (255 - v) * -amt));
  return "#" + c.map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("").toUpperCase();
}
function lab(hex){
  const [r,g,b] = rgb(hex).map(v => { v /= 255; return v <= .04045 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); });
  const x = (r*.4124 + g*.3576 + b*.1805) / .95047;
  const y = (r*.2126 + g*.7152 + b*.0722);
  const z = (r*.0193 + g*.1192 + b*.9505) / 1.08883;
  const f = t => t > .008856 ? Math.cbrt(t) : (7.787*t + 16/116);
  const [fx,fy,fz] = [f(x), f(y), f(z)];
  return [116*fy - 16, 500*(fx - fy), 200*(fy - fz)];
}
/** CIE76 色差：數字越小越像。同色 0，一般認為 <12 在遠處會混淆 */
function deltaE(h1, h2){
  const a = lab(h1), b = lab(h2);
  return Math.sqrt(Math.pow(a[0]-b[0],2) + Math.pow(a[1]-b[1],2) + Math.pow(a[2]-b[2],2));
}
/** 已選色的班兩兩比對，回傳顏色不同但太接近的配對 */
function clashes(){
  const f = filled().filter(c => meta(c).hex), out = [];
  for(let i = 0; i < f.length; i++){
    for(let j = i + 1; j < f.length; j++){
      if(sameHex(meta(f[i]).hex, meta(f[j]).hex)) continue;
      const d = deltaE(meta(f[i]).hex, meta(f[j]).hex);
      if(d < CFG.nearThreshold) out.push({a:f[i], b:f[j], d:d, ha:meta(f[i]).hex, hb:meta(f[j]).hex});
    }
  }
  return out.sort((x, y) => x.d - y.d);
}
const paletteName = hex => {
  const p = CFG.palette.find(q => sameHex(q.hex, hex));
  return p ? p.name : (normHex(hex) || "");
};
/** 領口袖口配色：空字串代表跟主色同色 */
const trimName = hex => {
  if(!normHex(hex)) return "同主色";
  const t = CFG.trims.find(q => sameHex(q.hex, hex));
  return t ? t.name : paletteName(hex);
};

/* ============================================================
   名額與抽籤
   一個顏色最後只留 perColor 個班（預設 1）。只要有兩個班以上想要同一顏色，
   就全部進抽籤 —— 包含最早送出的那一班，先送出沒有保障（這是使用者明確選的）。

   只有一個班登記時不必抽，直接算他的，但那是「暫定」：
   截止前別班還是可以登記同一個顏色，一登記兩邊就都變成待抽籤。
   所以色票只有在「已經抽完、名額定案」時才會鎖住點不下去。
   抽輸的班記在 draws[].lose，對該色永久出局，必須改選。
   ============================================================ */
/** 曾經在這個顏色抽輸的班 */
function losers(hex){
  const out = {};
  (state.draws || []).forEach(d => {
    if(sameHex(d.hex, hex)) (d.lose || []).forEach(c => { out[c] = d; });
  });
  return out;
}
/** 一次抽籤抽中的班（舊格式一次只抽一席，這裡一起吃） */
const drawWins = d => (d && (d.wins || (d.win ? [d.win] : []))) || [];
/** 抽中這個顏色的班 */
function winners(hex){
  return (state.draws || []).filter(d => sameHex(d.hex, hex))
    .reduce((a, d) => a.concat(drawWins(d)), []);
}
/** 目前選了這個顏色的班，依選色時間排序（同時間以班級序） */
function pickers(hex){
  return CFG.classes.filter(c => meta(c) && sameHex(meta(c).hex, hex))
    .sort((a, b) => String(meta(a).at || "").localeCompare(String(meta(b).at || "")) || a.localeCompare(b));
}
/** 這個顏色的席位盤點：seated 已入席（抽中或暫定）、waiting 待抽籤、out 抽輸需改選 */
function seatsOf(hex){
  const lose = losers(hex), win = winners(hex);
  const all = pickers(hex);
  const out = all.filter(c => lose[c]);
  const live = all.filter(c => !lose[c]);
  const seated = [], waiting = [];
  /* 只有一個班登記就不必抽 —— 規則是「兩個班以上想要才抽籤」。
     但這個席位是暫定的：別班還可以來登記，一來兩邊就都回到待抽籤。
     抽輸的班已經不在 live 裡，所以這裡看的是目前真正在爭的班。 */
  const alone = live.length === 1 && !win.length;
  live.forEach(c => {
    if(seated.length < CFG.freeSeats){ seated.push(c); return; }
    if(win.indexOf(c) >= 0 && seated.length < CFG.perColor){ seated.push(c); return; }
    if(alone){ seated.push(c); return; }
    waiting.push(c);
  });
  return {hex:normHex(hex), seated:seated, waiting:waiting, out:out,
          reg:live.length,                    /* 目前登記這個顏色的班數 */
          provisional:alone,                  /* 席位只是暫定，還沒抽過 */
          open:Math.max(0, CFG.perColor - seated.length), free:Math.max(0, CFG.freeSeats - seated.length)};
}
/** 這個顏色是不是已經定案了（定案才鎖住色票，暫定的還可以被別班挑戰） */
const settled = s => s.open <= 0 && !s.provisional;
/** 一個班目前的狀態：none 未選／free 暫定／won 抽中／wait 待抽籤／out 需改選 */
function statusOf(cls){
  const m = meta(cls);
  if(!m || !m.hex) return "none";
  const s = seatsOf(m.hex);
  if(s.out.indexOf(cls) >= 0) return "out";
  if(s.seated.indexOf(cls) < 0) return "wait";
  return winners(m.hex).indexOf(cls) >= 0 ? "won" : "free";
}
const STATUS = {
  none:{label:"未選色", cls:"", txt:"尚未選色"},
  free:{label:"暫定",   cls:"wait", txt:"目前只有這一班登記，暫時算這一班的"},
  won: {label:"確定",   cls:"won",  txt:"抽籤抽中，名額確定"},
  wait:{label:"待抽籤", cls:"wait", txt:"已登記，等抽籤定案"},
  out: {label:"需改選", cls:"out",  txt:"抽籤未抽中，請改選其他顏色"}
};

function pendingDraws(){

/** 可重現的亂數：同一個種子一定抽出同一個順序，任何人都能重算查驗 */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/** 種子洗牌（Fisher–Yates） */
function shuffle(list, seed){
  const r = mulberry32(seed), a = list.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(r() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function newSeed(){
  try{
    const b = new Uint32Array(1);
    crypto.getRandomValues(b);
    return b[0] >>> 0;
  }catch(e){ return Math.floor(Math.random() * 4294967296) >>> 0; }
}

function fmtStamp(d){
  const z = n => String(n).padStart(2, "0");
  return (d.getFullYear() - 1911) + "/" + z(d.getMonth()+1) + "/" + z(d.getDate())
    + " " + z(d.getHours()) + ":" + z(d.getMinutes());
}
function shortStamp(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return "—";
  const z = n => String(n).padStart(2, "0");
  return z(d.getMonth()+1) + "/" + z(d.getDate()) + " " + z(d.getHours()) + ":" + z(d.getMinutes());
}
const num = (v, max) => {
  const n = Math.floor(Number(v));
  return isFinite(n) && n > 0 ? Math.min(n, max == null ? 999 : max) : 0;
};

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.async = false;
    s.onload = res;
    s.onerror = () => rej(new Error("script " + src));
    document.head.appendChild(s);
  });
}
async function initFirebase(){
  SYNC.mode = "connecting"; renderSync();
  try{
    await loadScript(FIRE_SDK + "firebase-app-compat.js");
    await loadScript(FIRE_SDK + "firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);
    SYNC.db = firebase.firestore();
    SYNC.ref = SYNC.db.collection(FIRE_COL).doc(FIRE_ID);
    SYNC.unsub = SYNC.ref.onSnapshot({includeMetadataChanges:true},
      snap => {
        adopt(snap.exists ? (snap.data() || {}) : null);
        SYNC.mode = "fire"; SYNC.pending = false;
        /* 連不上雲端時 Firestore 仍會回快取快照，不能當成連線成功 —— 否則導師會
           以為填的東西大家都看得到，其實只在自己手機裡。 */
        SYNC.cached = !!(snap.metadata && snap.metadata.fromCache);
        clearTimeout(SYNC.cacheTimer);
        if(SYNC.cached){
          SYNC.cacheTimer = setTimeout(() => {          /* 給第一次連線幾秒緩衝，避免閃爍 */
            if(SYNC.cached){
              SYNC.note = "連不上雲端，畫面是本機快取，填寫還沒送出去";
              renderSync();
            }
          }, 6000);
        }else{
          SYNC.note = "";
        }
        saveLocal(); renderAll(); pullArt();
      },
      err => {
        SYNC.mode = "local";
        SYNC.note = (err && err.code === "permission-denied")
          ? "Firestore 規則尚未開放 " + FIRE_COL + "，資料僅存在這台裝置"
          : "即時共用連線失敗，資料僅存在這台裝置";
        renderSync();
      }
    );
  }catch(e){
    SYNC.mode = "local";
    SYNC.note = "載入不到即時共用元件，資料僅存在這台裝置";
    renderSync();
  }
}

function fireCommit(mutate){
  return SYNC.db.runTransaction(async t => {
    const snap = await t.get(SYNC.ref);
    const d = snap.exists ? (snap.data() || {}) : {};
    const data = {classes:d.classes ? JSON.parse(JSON.stringify(d.classes)) : {},
                  draws:d.draws ? JSON.parse(JSON.stringify(d.draws)) : [],
                  quotes:d.quotes ? JSON.parse(JSON.stringify(d.quotes)) : {}};
    mutate(data);
    t.set(SYNC.ref, {classes:data.classes, draws:data.draws, quotes:data.quotes,
                     updated:new Date().toISOString(), v:1});
  });
}
/** 拒絕這次異動並把原因說給使用者聽（名額被搶走之類的） */
function refuse(msg){
  const e = new Error(msg);
  e.refuse = true;
  throw e;
}
/** 所有異動都走這裡：fire 模式進交易（重新讀一次才判名額），其餘就地套用 */
async function commit(mutate){
  if(SYNC.mode === "fire"){
    SYNC.pending = true; renderSync();
    try{
      await fireCommit(mutate);
      SYNC.pending = false; SYNC.note = ""; renderSync();
      return true;                        /* onSnapshot 會帶回最新結果並重繪 */
    }catch(e){
      SYNC.pending = false;
      if(e && e.refuse){ renderSync(); toast(e.message); return false; }
      SYNC.note = "儲存失敗，請再試一次";
      renderSync();
      clearTimeout(SYNC.timer);
      SYNC.timer = setTimeout(() => { SYNC.note = ""; renderSync(); }, 3200);
      return false;
    }
  }
  const before = JSON.stringify(state);
  try{
    mutate(state);
  }catch(e){
    state = JSON.parse(before);
    if(e && e.refuse){ toast(e.message); return false; }
    throw e;
  }
  state.updated = new Date().toISOString();
  saveLocal(); queuePush(); renderAll();
  return true;
}
function queuePush(){
  if(SYNC.mode !== "shared" || !SYNC.api) return;
  SYNC.pending = true; renderSync();
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(push, 700);
}
async function push(){
  if(!SYNC.api) return;
  try{
    await SYNC.api.publish({"data/banfu5.json": JSON.stringify(state)});
    SYNC.pending = false; SYNC.note = ""; renderSync();
  }catch(e){
    const c = e && e.code;
    SYNC.pending = false;
    if(c === "conflict"){
      SYNC.note = "剛才有人同時送出，正在載入最新版…";
      renderSync(); setTimeout(() => location.reload(), 900);
    }else if(c === "rate_limited"){
      SYNC.note = "儲存太頻繁，稍候再試"; renderSync();
      clearTimeout(SYNC.timer); SYNC.timer = setTimeout(push, 4000);
    }else{
      SYNC.mode = "local";
      SYNC.note = (c === "not_writer" || c === "not_granted")
        ? "你只有檢視權限，填寫僅存在這台裝置"
        : "共用儲存無法使用，填寫僅存在這台裝置";
      renderSync();
    }
  }
}

const artRef = (cls, f) => SYNC.ref.collection("art").doc(cls + "_" + f);

/** 圖案時間戳和快取不一致就補抓。班級端只抓自己的，其他檢視抓全部 */
function pullArt(){
  if(SYNC.mode !== "fire") return;
  const want = (VIEW.key === "class") ? (me ? [me] : []) : CFG.classes;
  want.forEach(c => {
    ["front","back"].forEach(f => {
      const at = artAt(c, f);
      const k = artKey(c, f);
      if(!at) return;
      if(ART[k] && ART[k].at === at) return;
      if(ARTing[k] === at) return;
      ARTing[k] = at;
      artRef(c, f).get()
        .then(s => {
          if(s.exists){
            const d = s.data() || {};
            ART[k] = {thumb:d.thumb || d.full || "", full:d.full || d.thumb || "", at:d.at || at};
            if(c === me) saveMyArtLocal();
            renderCards(); renderFit(); renderSizeTable(); renderQuote();
          }
        })
        .catch(() => {})
        .then(() => { delete ARTing[k]; });
    });
  });
}
function saveMyArtLocal(){
  try{
    const o = {};
    ["front","back"].forEach(f => { const k = artKey(me, f); if(ART[k]) o[k] = ART[k]; });
    localStorage.setItem(LS_ART, JSON.stringify(o));
  }catch(e){}

async function saveArt(cls, f, thumb, full){
  const at = new Date().toISOString();
  if(SYNC.mode === "fire"){
    await artRef(cls, f).set({full:full, thumb:thumb, at:at, by:cls});
  }
  ART[artKey(cls, f)] = {thumb:thumb, full:full, at:at};
  if(cls === me) saveMyArtLocal();
  return at;
}

function renderSync(){
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncText");
  let cls = "dot", s;
  if(SYNC.mode === "fire"){
    if(SYNC.cached && SYNC.note){ cls += " bad"; s = SYNC.note; }
    else if(SYNC.cached){ cls += " local"; s = "連線中，尚未確認雲端資料…"; }
    else s = "即時共用中，全校 " + CFG.classes.length + " 班看到同一份";
  }else if(SYNC.mode === "shared"){
    s = "即時共用中（Artifact 模式，不支援圖案上傳）";
  }else if(SYNC.mode === "connecting"){
    cls += " local"; s = "連線中…";
  }else{
    cls += " local"; s = SYNC.note || "資料儲存在這台裝置的瀏覽器";
  }
  if(SYNC.pending) s = "儲存中…";
  if(SYNC.note && SYNC.mode !== "fire") s = SYNC.note;
  dot.className = cls;
  txt.textContent = s;
}

/* ============================================================
   線上試衣間：純 SVG 畫一件衣服，顏色、款式、圖案都是屬性
   同一組程式碼供三處使用 —— 班級端大圖、色卡牆縮圖、匯出用點陣圖。
   座標系固定 400×470，圖案位置也用同一組座標存，換裝置看起來一樣。
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
const XLINK = "http://www.w3.org/1999/xlink";
const SHIRT_W = 400, SHIRT_H = 470;
let uid = 0;

const NECKS = {
  "圓領":    "C168,50 172,88 200,88 C228,88 232,50 260,52",
  "V 領":    "C166,54 178,64 200,116 C222,64 234,54 260,52",
  "POLO 領": "C168,50 172,80 200,80 C228,80 232,50 260,52",
  back:      "C170,50 176,66 200,66 C224,66 230,50 260,52"
};
const SLEEVES = {
  "短袖": {r:"L352,152 L298,182 L280,158", l:"L102,182 L48,152 L94,72",
           cuffR:"M352,152 L298,182 L290,168 L344,138 Z", cuffL:"M48,152 L102,182 L110,168 L56,138 Z"},
  "長袖": {r:"L348,146 L374,318 L322,332 L280,158", l:"L78,332 L26,318 L52,146 L94,72",
           cuffR:"M374,318 L322,332 L318,316 L370,302 Z", cuffL:"M26,318 L78,332 L82,316 L30,302 Z"}
};
const neckPath = (neck, face) => (face === "back") ? NECKS.back : (NECKS[neck] || NECKS["圓領"]);
const sleeveSet = sleeve => SLEEVES[sleeve] || SLEEVES["短袖"];

function bodyPath(sleeve, neck, face){
  const s = sleeveSet(sleeve);
  return "M140,52 " + neckPath(neck, face) + " L306,72 " + s.r
       + " L276,424 C270,438 240,444 200,444 C160,444 130,438 124,424 L120,158 " + s.l + " Z";
}
const collarPath = (neck, face) => "M140,52 " + neckPath(neck, face);
const INNER_NECK = "M140,52 C160,30 240,30 260,52 C244,126 156,126 140,52 Z";
const FOLDS = "M152,196 C162,258 150,332 160,418 M248,196 C238,258 250,332 240,418 "
            + "M126,168 C146,190 152,214 150,238 M274,168 C254,190 248,214 250,238";

function svgEl(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  if(attrs) Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
  return e;
}
/** 建一件空白的衣服，回傳可重複套用規格的節點集合 */
function mkShirt(){
  const id = "s" + (++uid);
  const root = svgEl("svg", {viewBox:"0 0 " + SHIRT_W + " " + SHIRT_H, xmlns:SVGNS,
                            "xmlns:xlink":XLINK, width:"100%", role:"img"});
  const defs = svgEl("defs");
  const clip = svgEl("clipPath", {id:"c" + id});
  const clipPathEl = svgEl("path");
  clip.append(clipPathEl);
  const grad = svgEl("linearGradient", {id:"g" + id, x1:"0", y1:"0", x2:"0.25", y2:"1"});
  [["0","#ffffff",".17"], ["0.42","#ffffff","0"], ["0.72","#000000",".05"], ["1","#000000",".2"]]
    .forEach(s => grad.append(svgEl("stop", {offset:s[0], "stop-color":s[1], "stop-opacity":s[2]})));
  defs.append(clip, grad);

  const inner = svgEl("path", {d:INNER_NECK});
  const body  = svgEl("path", {"stroke-width":"1.6", "stroke-linejoin":"round"});
  const g     = svgEl("g", {"clip-path":"url(#c" + id + ")"});
  const art   = svgEl("image", {preserveAspectRatio:"xMidYMid meet", visibility:"hidden"});
  const folds = svgEl("path", {d:FOLDS, fill:"none", stroke:"#000000", "stroke-opacity":".055",
                              "stroke-width":"11", "stroke-linecap":"round"});
  const shade = svgEl("rect", {x:"0", y:"0", width:SHIRT_W, height:SHIRT_H, fill:"url(#g" + id + ")"});
  g.append(art, folds, shade);
  const collar  = svgEl("path", {fill:"none", "stroke-width":"9", "stroke-linecap":"round"});
  const cuffL   = svgEl("path", {stroke:"rgba(0,0,0,.14)", "stroke-width":"1"});
  const cuffR   = svgEl("path", {stroke:"rgba(0,0,0,.14)", "stroke-width":"1"});
  const placket = svgEl("g", {visibility:"hidden"});
  const pl1 = svgEl("path", {fill:"none", "stroke-width":"1.4", "stroke-dasharray":"5 4", "stroke-opacity":".5"});
  const pl2 = svgEl("path", {fill:"none", "stroke-width":"1.4", "stroke-dasharray":"5 4", "stroke-opacity":".5"});
  const b1  = svgEl("circle", {cx:"200", cy:"104", r:"5", stroke:"rgba(0,0,0,.2)", "stroke-width":"1"});
  const b2  = svgEl("circle", {cx:"200", cy:"134", r:"5", stroke:"rgba(0,0,0,.2)", "stroke-width":"1"});
  placket.append(pl1, pl2, b1, b2);
  const line = svgEl("path", {fill:"none", stroke:"rgba(0,0,0,.22)", "stroke-width":"1.6", "stroke-linejoin":"round"});
  root.append(defs, inner, body, g, collar, cuffL, cuffR, placket, line);
  return {root:root, clip:clipPathEl, inner:inner, body:body, art:art, collar:collar,
          cuffL:cuffL, cuffR:cuffR, placket:placket, pl1:pl1, pl2:pl2, b1:b1, b2:b2, line:line,
          src:null};
}
/** spec: {hex, trim, sleeve, neck, face, art:{x,y,w}, img} */
function applyShirt(s, spec){
  const hex = normHex(spec.hex) || "#DDD8CE";
  const face = spec.face === "back" ? "back" : "front";
  const d = bodyPath(spec.sleeve, spec.neck, face);
  const trim = normHex(spec.trim) || shade(hex, .16);
  s.clip.setAttribute("d", d);
  s.body.setAttribute("d", d);
  s.body.setAttribute("fill", hex);
  s.body.setAttribute("stroke", shade(hex, .3));
  s.line.setAttribute("d", d);
  s.inner.setAttribute("fill", shade(hex, .34));
  s.collar.setAttribute("d", collarPath(spec.neck, face));
  s.collar.setAttribute("stroke", trim);
  const sl = sleeveSet(spec.sleeve);
  s.cuffL.setAttribute("d", sl.cuffL); s.cuffL.setAttribute("fill", trim);
  s.cuffR.setAttribute("d", sl.cuffR); s.cuffR.setAttribute("fill", trim);
  const polo = spec.neck === "POLO 領" && face === "front";
  s.placket.setAttribute("visibility", polo ? "visible" : "hidden");
  if(polo){
    s.pl1.setAttribute("d", "M186,80 L186,152"); s.pl1.setAttribute("stroke", trim);
    s.pl2.setAttribute("d", "M214,80 L214,152"); s.pl2.setAttribute("stroke", trim);
    s.b1.setAttribute("fill", trim); s.b2.setAttribute("fill", trim);
  }
  const a = spec.art, img = spec.img;
  if(img && a){
    const w = Math.max(20, Number(a.w) || 150);
    s.art.setAttribute("x", (Number(a.x) || 200) - w / 2);
    s.art.setAttribute("y", (Number(a.y) || 210) - w / 2);
    s.art.setAttribute("width", w);
    s.art.setAttribute("height", w);
    if(s.src !== img){
      s.art.setAttribute("href", img);
      s.art.setAttributeNS(XLINK, "xlink:href", img);
      s.src = img;
    }
    s.art.setAttribute("visibility", "visible");
  }else{
    s.art.setAttribute("visibility", "hidden");
  }
}

/** 某班目前該怎麼畫（色卡牆與匯出用） */
function specOf(cls, f, thumb){
  const m = meta(cls);
  if(!m) return null;
  const a = (m.art && m.art[f]) || ART_PRESETS[f === "back" ? "big" : "chest"];
  const k = artAt(cls, f) ? ART[artKey(cls, f)] : null;
  return {hex:m.hex, trim:m.trim, sleeve:m.sleeve, neck:m.neck, face:f, art:a,
          img:k ? (thumb ? k.thumb : (k.full || k.thumb)) : null};
}
/** 班級端草稿現在該怎麼畫 */
function draftSpec(f){
  if(!draft) return null;
  const local = draft.imgs && draft.imgs[f];
  const dropped = draft.drop && draft.drop[f];
  const k = (me && !dropped && artAt(me, f)) ? ART[artKey(me, f)] : null;
  return {hex:draft.hex, trim:draft.trim, sleeve:draft.sleeve, neck:draft.neck, face:f,
          art:draft.art[f], img:local ? local.full : (k ? (k.full || k.thumb) : null)};
}

const FIT = {front:null, back:null};
function renderFit(){
  if(!document.getElementById("shirtFront")) return;
  ["front","back"].forEach(f => {
    if(!FIT[f]){
      FIT[f] = mkShirt();
      document.getElementById(f === "front" ? "shirtFront" : "shirtBack").append(FIT[f].root);
    }
    const spec = draftSpec(f);
    applyShirt(FIT[f], spec || {hex:"#DDD8CE", sleeve:CFG.sleeves[0], neck:CFG.necks[0], face:f});
  });
  document.getElementById("fitFront").classList.toggle("sel", face === "front");
  document.getElementById("fitBack").classList.toggle("sel", face === "back");
  document.getElementById("faceLabel").textContent = "目前調整：" + (face === "front" ? "正面" : "背面");
  const a = draft ? draft.art[face] : ART_PRESETS.chest;
  const set = (id, oid, v) => {
    const e = document.getElementById(id);
    if(e && document.activeElement !== e) e.value = v;
    const o = document.getElementById(oid);
    if(o) o.value = v;
  };
  set("rW", "oW", Math.round(a.w));
  set("rY", "oY", Math.round(a.y));
  set("rX", "oX", Math.round(a.x));
  const has = !!(draft && ((draft.imgs && draft.imgs[face])
                || (me && !draft.drop[face] && artAt(me, face))));
  const hint = document.getElementById("artHint");
  if(hint){
    const parts = [];
    ["front","back"].forEach(f => {
      const local = draft && draft.imgs && draft.imgs[f];
      const dropped = draft && draft.drop[f];
      const up = me && artAt(me, f);
      parts.push((f === "front" ? "正面" : "背面") + "："
        + (local ? "已選好，尚未送出" : (dropped ? "待移除，尚未送出" : (up ? "已上傳" : "尚未上傳"))));
    });
    if(SYNC.mode === "shared") parts.push("Artifact 模式無法上傳圖案，請走 GitHub Pages 網址");
    hint.textContent = parts.join("　·　");
  }
  const clr = document.getElementById("btnArtClear");
  if(clr) clr.disabled = !has;
}

/* ---------- 班級端 ---------- */
function newDraft(cls, blank){
  const m = blank ? null : meta(cls);
  const sz = {};
  CFG.sizes.forEach(k => { sz[k] = (m && m.sizes && m.sizes[k]) || 0; });
  const a = blankArt();
  if(m && m.art){
    ["front","back"].forEach(f => { if(m.art[f]) Object.assign(a[f], m.art[f]); });
  }
  return {hex:(m && m.hex) || null,
          sleeve:(m && m.sleeve) || CFG.sleeves[0],
          neck:(m && m.neck) || CFG.necks[0],
          trim:(m && m.trim) || "",
          art:a, sizes:sz, note:(m && m.note) || "",
          imgs:{front:null, back:null},
          drop:{front:false, back:false}};
}

function renderSwatches(){
  const box = document.getElementById("swatches");
  if(!box) return;
  box.textContent = "";
  CFG.palette.forEach(p => {
    const s = seatsOf(p.hex);
    const mine = me && (s.seated.indexOf(me) >= 0 || s.waiting.indexOf(me) >= 0);
    const barred = me && s.out.indexOf(me) >= 0;
    const b = el("button", "sw" + (settled(s) ? " full" : ""));
    b.type = "button";
    b.setAttribute("aria-pressed", draft && sameHex(draft.hex, p.hex) ? "true" : "false");
    b.disabled = !me || barred || (settled(s) && !mine);
    const i = el("i"); i.style.background = p.hex; b.append(i);
    b.append(el("b", null, p.name));
    const seats = el("span", "seats");
    for(let k = 0; k < CFG.perColor; k++){
      const dot = el("s");
      if(k < s.seated.length) dot.className = (s.seated[k] === me) ? "mine" : "take";
      else if(s.waiting.length && k === s.seated.length) dot.className = "wait";
      seats.append(dot);
    }
    b.append(seats);
    let note;
    if(barred) note = "你已抽過此色";
    else if(settled(s)) note = "已定案 · " + s.seated.join("、");
    else if(!s.reg) note = "還沒有人登記";
    else if(s.waiting.length) note = s.reg + " 班登記 · 抽 " + s.open + " 席";
    else note = s.reg + " 班登記 · 再有人選就抽籤";
    b.append(el("u", null, note));
    b.title = p.name + " " + p.hex + "　" + note
      + (s.seated.length ? "　" + (s.provisional ? "暫定：" : "已定案：") + s.seated.join("、") : "")
      + (s.waiting.length ? "　待抽籤：" + s.waiting.join("、") : "");
    b.addEventListener("click", () => {
      if(!draft) return;
      draft.hex = normHex(p.hex);
      renderSwatches(); renderFit(); renderClassFlags();
    });
    box.append(b);
  });
  const used = CFG.palette.filter(p => seatsOf(p.hex).reg).length;
  const done = CFG.palette.filter(p => settled(seatsOf(p.hex))).length;
  document.getElementById("colorTally").innerHTML =
    "有班級登記 <b>" + used + "</b> 色　·　已定案 <b>" + done + "</b> 色";
  document.getElementById("colorHint").textContent =
    "一個顏色最後只有 " + CFG.perColor + " 個班能用。兩個班以上想要同一個顏色，就抽籤決定留哪一班，"
    + "沒抽中的班要改選。色塊下方的小格子就是這個顏色的席次。"
    + "先送出不會比較有利 —— 抽籤時所有登記這個顏色的班一起抽。";
}
function syncFormInputs(){

function buildSizeGrid(){
  const box = document.getElementById("sizeGrid");
  if(!box || box.children.length) return;
  CFG.sizes.forEach(k => {
    const c = CFG.sizeChart.find(x => x.size === k);
    const cell = el("div", "size");
    cell.append(el("span", null, k));
    const inp = document.createElement("input");
    inp.type = "number"; inp.min = "0"; inp.max = "200"; inp.inputMode = "numeric";

function mkFlag(kind, text, hexes){
  const f = el("div", "flag" + (kind ? " " + kind : ""));
  if(hexes && hexes.length){
    const d = el("span", "dabs");
    hexes.forEach(h => { const i = el("i"); i.style.background = h; d.append(i); });
    f.append(d);
  }
  const s = el("span");
  s.innerHTML = text;
  f.append(s);
  return f;
}
function renderClassFlags(){
  const box = document.getElementById("formFlags");
  if(!box) return;
  box.textContent = "";
  const cbox = document.getElementById("colorFlags");
  cbox.textContent = "";
  if(!me){ cbox.append(mkFlag("", "先在上面點選你的班級。")); return; }

  const st = statusOf(me);
  const m = meta(me);
  if(st === "out"){
    const d = losers(m.hex)[me];
    cbox.append(mkFlag("warn",
      "<b>" + paletteName(m.hex) + " 抽籤沒有抽中</b>（" + shortStamp(d && d.at) + " 抽，抽中的是 "
      + drawWins(d).join("、") + " 班）。請改選其他還沒定案的顏色，再按送出。", [m.hex]));
  }else if(st === "wait"){
    const s = seatsOf(m.hex);
    cbox.append(mkFlag("note",
      "<b>" + paletteName(m.hex) + "</b> 目前有 " + s.reg + " 個班登記（" + s.waiting.join("、")
      + "），最後只留 " + CFG.perColor + " 個班，要等抽籤定案。"
      + "沒抽中的 " + (s.reg - s.open) + " 個班要改選其他顏色。", [m.hex]));
  }else if(st === "won"){
    cbox.append(mkFlag("good",
      "<b>" + paletteName(m.hex) + "</b> 抽籤抽中，名額確定，這個顏色是你們的了。", [m.hex]));
  }else if(st === "free"){
    cbox.append(mkFlag("good",
      "目前只有你這一班登記 <b>" + paletteName(m.hex) + "</b>，暫時算你們的。"
      + "截止前若有別班也登記同一色，兩班要一起抽籤 —— 先送出不會比較有利。", [m.hex]));
  }
  if(draft && draft.hex && (!m || !sameHex(m.hex, draft.hex))){
    const s = seatsOf(draft.hex);
    cbox.append(mkFlag("note",
      "草稿選的是 <b>" + paletteName(draft.hex) + "</b>（目前 " + s.reg + " 個班登記），"
      + "<b>要按下方送出才算數</b>。", [draft.hex]));
  }

  /* 撞色：顏色不同但遠看會混 */
  if(draft && draft.hex){
    const near = CFG.classes.filter(c => c !== me && meta(c) && meta(c).hex && !sameHex(meta(c).hex, draft.hex))
      .map(c => ({c:c, d:deltaE(draft.hex, meta(c).hex), h:meta(c).hex}))
      .filter(x => x.d < CFG.nearThreshold).sort((a, b) => a.d - b.d);
    if(near.length){
      box.append(mkFlag("note", "和 " + near.map(x => x.c).join("、")
        + " 班的顏色很接近，運動會遠遠看可能分不出來。",
        [draft.hex].concat(near.map(x => x.h))));
    }
  }
  const t = draft ? CFG.sizes.reduce((n, k) => n + num(draft.sizes[k], 200), 0) : 0;
  if(!t) box.append(mkFlag("", "各尺寸件數還是 0，記得把全班的件數填進去（含師長要的話一起填）。"));
  const noArt = draft && !draft.imgs.front && !ART[artKey(me, "front")] && !ART[artKey(me, "back")];
  if(noArt) box.append(mkFlag("", "還沒上傳設計圖案。先送出顏色和件數也可以，圖案之後再補。"));
}

/** 在交易剛讀到的那份資料上重算名額，而不是畫面上可能過期的資料 */
function withState(st, fn){
  const keep = state;
  state = st;
  try{ return fn(); }finally{ state = keep; }
}
function lbShow(node){

    host = el("div");

      + "max-height:100%;overflow:auto;box-shadow:0 20px 60px -20px #000";

function renderDraw(){
  const box = document.getElementById("drawList");
  if(!box) return;
  document.getElementById("drawRule").textContent =
    "規則：一個顏色最後只留 " + CFG.perColor + " 個班。兩個班以上登記同一個顏色就要抽籤，"
    + "登記的班全部一起抽（包含最早送出的那一班，先送出沒有保障）。沒抽中的班要改選，"
    + "而且不能再登記這個顏色。建議收件截止後再抽 —— 太早抽，後面才填的班就沒機會了。"
    + "抽籤用可重現的亂數，種子與抽出順序都留在下面的紀錄裡，任何人都能重算查驗。";
  box.textContent = "";
  const pend = pendingDraws();
  if(!pend.length){
    box.append(mkFlag("good", "目前沒有需要抽籤的顏色。"));
  }
  pend.forEach(s => {
    const card = el("div", "draw");
    const hd = el("div", "hd");
    const i = el("i"); i.style.background = s.hex; hd.append(i);
    hd.append(el("b", null, s.name));
    hd.append(el("span", "hx", s.hex));
    card.append(hd);
    const who = el("div", "who");
    const n = Math.min(s.open, s.waiting.length);
    who.innerHTML = (s.seated.length ? "已抽中確定：<b>" + s.seated.join("、") + "</b><br>" : "")
      + "登記待抽：<b>" + s.waiting.join("、") + "</b>（" + s.waiting.length + " 班抽 " + n + " 席"
      + (s.waiting.length > n ? "，會有 " + (s.waiting.length - n) + " 個班要改選" : "，都抽得到")
      + "）"
      + (s.out.length ? "<br>先前抽輸、已不能再登記此色：" + s.out.join("、") : "");
    card.append(who);
    const act = el("div", "actions");
    const b = el("button", "btn sm", "主持抽籤");
    b.type = "button";
    armed(b, "主持抽籤", () => runDraw(s.hex));
    act.append(b);
    card.append(act);
    box.append(card);
  });

  const log = document.getElementById("drawLog");
  log.textContent = "";
  const ds = (state.draws || []).slice().reverse();
  if(!ds.length){
    log.append(el("div", "logrow", "還沒有任何抽籤紀錄。"));
  }
  ds.forEach(d => {
    const row = el("div", "logrow");
    const i = el("i"); i.style.background = d.hex; row.append(i);
    const t = el("div");
    const w = drawWins(d);
    t.innerHTML = "<b>" + paletteName(d.hex) + "</b> · 抽中 <b>" + w.join("、") + "</b>"
      + ((d.lose || []).length ? "　未抽中 " + d.lose.join("、") : "") + "<br>"
      + "參與：" + (d.entrants || []).join("、")
      + "　→　抽籤順序 " + (d.order || []).join(" → ") + "<br>"
      + "<span class='seed'>" + shortStamp(d.at) + " · 亂數種子 " + d.seed + "</span>";
    row.append(t);
    log.append(row);

async function runDraw(hex){
  const seed = newSeed();
  let result = null;
  const ok = await commit(d => {
    const s = withState(d, () => seatsOf(hex));
    if(!s.waiting.length) refuse("這個顏色目前沒有等著抽的班級，畫面剛剛更新過");
    if(s.open <= 0) refuse("這個顏色已經定案了，不需要抽籤");
    const order = shuffle(s.waiting, seed);
    const n = Math.min(s.open, order.length);
    result = {hex:normHex(hex), at:new Date().toISOString(), seed:seed,
              entrants:s.waiting.slice(), order:order,
              wins:order.slice(0, n), lose:order.slice(n)};
    d.draws = (d.draws || []).concat([result]);
  });
  if(ok && result) showReel(result);
}
/** 抽籤動畫：結果早就定了，這裡只是把它演出來給大家看 */
function showReel(d){
  const wrap = el("div");
  wrap.style.cssText = "display:flex;flex-direction:column;gap:10px;align-items:center;min-width:min(86vw,330px)";
  const t = el("div", null, paletteName(d.hex) + " 抽籤");

  const reel = el("div", "reel", "…");

    (d.entrants || []).join("、") + " 抽 " + drawWins(d).length + " 席");
  wrap.append(t, sw, reel, sub);
  lbShow(wrap);
  const pool = d.entrants || [];
  let n = 0;

function vendorId(){

    try{ localStorage.setItem(LS_VD, vendorKey); }catch(e){}
  }

let QD = null, QDat = "";
function quoteDraft(){
  if(!QD){
    const q = myQuote();
    QD = q ? JSON.parse(JSON.stringify(q)) : {name:"", contact:"", valid:"", big:0, note:"", items:{}};
    QDat = (q && q.at) || "";
  }
  return QD;
}
const qItem = c => {
  const q = quoteDraft();
  if(!q.items) q.items = {};
  if(!q.items[c]) q.items[c] = {unit:0, plate:0};
  return q.items[c];
};
/** 一份報價的小計與總計：件數×單價 ＋ 大尺寸加價 ＋ 版費 */
function quoteCalc(q){
  const big = num(q && q.big, 9999);
  const rows = CFG.classes.map(c => {
    const it = (q && q.items && q.items[c]) || {};
    const qty = totalOf(c), bg = bigCount(c);
    const unit = num(it.unit, 99999), plate = num(it.plate, 999999);
    /* 沒填單價也沒填版費＝這班還沒報，小計算 0，不要只剩加價 */
    return {cls:c, qty:qty, big:bg, unit:unit, plate:plate,
            sub:(unit || plate) ? (qty * unit + bg * big + plate) : 0};
  });
  const qty = rows.reduce((n, r) => n + r.qty, 0);
  const amount = rows.reduce((n, r) => n + r.sub, 0);
  const priced = rows.filter(r => r.unit > 0).length;
  return {rows:rows, qty:qty, amount:amount, priced:priced, avg:qty ? amount / qty : 0};
}

/* ============================================================
   設計圖案：一律在瀏覽器端縮圖 + 壓縮再上傳
   去背 PNG 會走 PNG（保留透明），照片類走 JPEG（省很多空間）。
   full 給試衣間與匯出，thumb 給色卡牆與表格。
   ============================================================ */
const ART_SPEC = {full:{edge:900, q:.82, max:540000}, thumb:{edge:300, q:.72, max:90000}};
async function decodeFile(file){
  if(typeof createImageBitmap === "function"){
    try{ return await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){}
    try{ return await createImageBitmap(file); }catch(e){}
  }
  return await new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const i = new Image();
    i.onload = () => { URL.revokeObjectURL(url); res(i); };
    i.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    i.src = url;
  });
}
function drawScaled(src, edge, opaque){
  const s = Math.min(1, edge / Math.max(src.width, src.height));
  const w = Math.max(1, Math.round(src.width * s)), h = Math.max(1, Math.round(src.height * s));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  if(opaque){ g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); }
  g.drawImage(src, 0, 0, w, h);
  return cv;
}
/** 圖案多半是去背 PNG，壓成 JPEG 會多一塊白底貼在衣服上，所以先驗透明 */
function hasAlpha(src){
  try{
    const cv = drawScaled(src, 220, false);
    const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
    for(let i = 3; i < d.length; i += 4) if(d[i] < 250) return true;
  }catch(e){}
  return false;
}
/** 先降畫質再降尺寸，直到 dataURL 小於上限（Firestore 單一文件 1MB） */
function encodeArt(src, spec, alpha){
  let e = spec.edge, q = spec.q, out = "";
  for(let n = 0; n < 9; n++){
    const cv = drawScaled(src, e, !alpha);
    out = alpha ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", q);
    if(out.length <= spec.max) return out;
    if(alpha) e = Math.round(e * .78);
    else if(q > .45) q -= .12;
    else e = Math.round(e * .82);
  }
  if(out.length > spec.max) throw new Error("圖檔太大壓不下來，請改用線條簡單一點的去背 PNG");
  return out;
}
async function pickArt(file){
  const src = await decodeFile(file);
  const alpha = hasAlpha(src);
  const full = encodeArt(src, ART_SPEC.full, alpha);
  const thumb = encodeArt(src, ART_SPEC.thumb, alpha);
  if(src.close) try{ src.close(); }catch(e){}
  return {full:full, thumb:thumb, alpha:alpha};
}

/* ---------- 班級端送出 ---------- */
async function saveMine(){
  if(!me || !draft) return;
  const hex = normHex(draft.hex);
  if(!hex){ toast("請先在上面點一個顏色"); return; }
  if(losers(hex)[me]){ toast("這個顏色你已經抽過籤沒抽中，請改選其他顏色"); return; }
  const pre = seatsOf(hex);
  const held = pre.seated.indexOf(me) >= 0 || pre.waiting.indexOf(me) >= 0;
  if(!held && settled(pre)){
    toast("這個顏色已經抽籤定案給 " + pre.seated.join("、") + " 班了，請改選其他顏色"); return;
  }
  const prev = meta(me);
  let frontAt = (prev && prev.frontAt) || null;
  let backAt  = (prev && prev.backAt) || null;
  for(const f of ["front","back"]){
    if(draft.drop[f] && !draft.imgs[f]){
      if(f === "front") frontAt = null; else backAt = null;
      continue;
    }
    if(!draft.imgs[f]) continue;
    try{
      const at = await saveArt(me, f, draft.imgs[f].thumb, draft.imgs[f].full);
      if(f === "front") frontAt = at; else backAt = at;
    }catch(e){
      toast((f === "front" ? "正面" : "背面") + "圖案上傳失敗，其他資料仍會送出");
    }
  }
  const sizes = {};
  CFG.sizes.forEach(k => { sizes[k] = num(draft.sizes[k], 200); });
  const rec = {hex:hex,
               sleeve:draft.sleeve || CFG.sleeves[0],
               neck:draft.neck || CFG.necks[0],
               trim:normHex(draft.trim) || "",
               art:{front:tidyArt(draft.art.front), back:tidyArt(draft.art.back)},
               sizes:sizes,
               note:(draft.note || "").trim().slice(0, 80),
               by:me, updated:new Date().toISOString()};
  if(frontAt) rec.frontAt = frontAt;
  if(backAt) rec.backAt = backAt;
  let after = "none";
  const ok = await commit(d => {
    const mine = d.classes[me];
    delete d.classes[me];
    const s = withState(d, () => seatsOf(hex));
    if(mine) d.classes[me] = mine;
    if(withState(d, () => losers(hex))[me]) refuse("這個顏色你已經抽過籤沒抽中，請改選其他顏色");
    if(settled(s)) refuse("慢了一步 —— 這個顏色剛剛抽籤定案了，請改選其他顏色");
    rec.at = (mine && sameHex(mine.hex, hex) && mine.at) ? mine.at : new Date().toISOString();
    d.classes[me] = rec;
    /* 交易回來時快照還沒到，state 仍是舊的 —— 名額狀態要用剛寫進去的這份算 */
    after = withState(d, () => statusOf(me));
  });
  if(ok){
    draft.imgs = {front:null, back:null};
    draft.drop = {front:false, back:false};
    renderAll();
    toast(me + " 班已送出　·　" + STATUS[after].txt

}

const CRCT = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder(), chunks = [], dir = [];
  const now = new Date();
  const dosT = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosD = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = (typeof f.data === "string") ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const h = new Uint8Array(30 + name.length), v = new DataView(h.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true);
    v.setUint16(8, 0, true); v.setUint16(10, dosT, true); v.setUint16(12, dosD, true);
    v.setUint32(14, crc, true); v.setUint32(18, data.length, true); v.setUint32(22, data.length, true);
    v.setUint16(26, name.length, true); v.setUint16(28, 0, true);
    h.set(name, 30);
    chunks.push(h, data);
    dir.push({name:name, crc:crc, size:data.length, off:off, t:dosT, d:dosD});
    off += h.length + data.length;
  });
  const cdStart = off;
  dir.forEach(c => {
    const h = new Uint8Array(46 + c.name.length), v = new DataView(h.buffer);
    v.setUint32(0, 0x02014b50, true); v.setUint16(4, 20, true); v.setUint16(6, 20, true);
    v.setUint16(8, 0x0800, true); v.setUint16(10, 0, true);
    v.setUint16(12, c.t, true); v.setUint16(14, c.d, true);
    v.setUint32(16, c.crc, true); v.setUint32(20, c.size, true); v.setUint32(24, c.size, true);
    v.setUint16(28, c.name.length, true); v.setUint16(30, 0, true); v.setUint16(32, 0, true);
    v.setUint16(34, 0, true); v.setUint16(36, 0, true); v.setUint32(38, 0, true);
    v.setUint32(42, c.off, true);
    h.set(c.name, 46);
    chunks.push(h); off += h.length;
  });
  const e = new Uint8Array(22), ev = new DataView(e.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, dir.length, true); ev.setUint16(10, dir.length, true);
  ev.setUint32(12, off - cdStart, true); ev.setUint32(16, cdStart, true); ev.setUint16(20, 0, true);
  chunks.push(e); off += 22;
  const out = new Uint8Array(off);
  let p = 0;
  chunks.forEach(c => { out.set(c, p); p += c.length; });
  return out;
}

function sheetXml(rows, cols, merges, heights){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(cols && cols.length){
    x += "<cols>";
    cols.forEach(c => { x += '<col min="' + c.min + '" max="' + c.max + '" width="' + c.w + '" customWidth="1"/>'; });
    x += "</cols>";
  }
  x += "<sheetData>";
  rows.forEach((row, ri) => {
    const h = heights && heights[ri];
    x += '<row r="' + (ri + 1) + '"' + (h ? ' ht="' + h + '" customHeight="1"' : "") + ">";
    row.forEach((cell, ci) => {
      if(cell == null) return;
      const ref = colName(ci) + (ri + 1);
      const s = cell.s ? ' s="' + cell.s + '"' : "";
      if(cell.v === "" || cell.v == null){ x += '<c r="' + ref + '"' + s + "/>"; }
      else { x += '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + xe(cell.v) + "</t></is></c>"; }
    });
    x += "</row>";
  });
  x += "</sheetData>";
  if(merges && merges.length){
    x += '<mergeCells count="' + merges.length + '">';
    merges.forEach(m => { x += '<mergeCell ref="' + m + '"/>'; });
    x += "</mergeCells>";
  }
  x += "</worksheet>";
  return x;
}

function buildXlsxFrom(sheets){
  let types = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
  let wbSheets = "", wbRels = "";
  const files = [];
  sheets.forEach((sh, i) => {
    const n = i + 1;
    types += '<Override PartName="/xl/worksheets/sheet' + n + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    wbSheets += '<sheet name="' + xe(sh.name) + '" sheetId="' + n + '" r:id="rId' + n + '"/>';
    wbRels += '<Relationship Id="rId' + n + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + n + '.xml"/>';
    files.push({name:"xl/worksheets/sheet" + n + ".xml",
                data:sheetXml(sh.rows, sh.cols, sh.merges, sh.heights)});
  });
  types += '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  wbRels += '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
  return zipStore([
    {name:"[Content_Types].xml", data:types},
    {name:"_rels/.rels", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '</Relationships>'},
    {name:"xl/workbook.xml", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      + '<sheets>' + wbSheets + '</sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + wbRels + '</Relationships>'},
    {name:"xl/styles.xml", data:STYLES_XML}
  ].concat(files));
}

const PC = {ink:"#1e1c19", dim:"#6d675e", faint:"#a9a297", line:"#c9c3b8", hair:"#ded8cd",
            head:"#f4f2ec", rowh:"#faf9f6", block:"#f2f0ea", warn:"#9c3412", good:"#1c7549"};
const FS = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const FM = '"IBM Plex Mono",ui-monospace,Menlo,monospace';

function shirtUrl(spec, w){
  const s = mkShirt();
  applyShirt(s, spec || {hex:"#DDD8CE", sleeve:CFG.sleeves[0], neck:CFG.necks[0], face:"front"});
  const width = w || SHIRT_W;
  s.root.setAttribute("width", width);
  s.root.setAttribute("height", Math.round(width * SHIRT_H / SHIRT_W));
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(s.root));
}
function loadImg(src){
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

/* ---------- 畫成 A4 橫式表格 → PDF ---------- */
function renderSheetCanvas(scale, imgs){
  const COLS = [{k:"cls", w:58, t:"班級"}, {k:"color", w:132, t:"顏色"}, {k:"style", w:104, t:"款式"},
                {k:"shirt", w:88, t:"試衣"}]
    .concat(CFG.sizes.map(s => ({k:s, w:44, t:s})))
    .concat([{k:"total", w:56, t:"合計"}, {k:"state", w:74, t:"名額"}, {k:"note", w:150, t:"備註"}]);
  const tableW = COLS.reduce((n, c) => n + c.w, 0);
  const PAD = 30, HT = 78, H1 = 30, RH = 48;
  const rows = CFG.classes.length + 1;
  const W = tableW + PAD * 2;
  const top = PAD + HT;
  const tableH = H1 + rows * RH;
  const ds = state.draws || [];
  const qs = Object.keys(state.quotes || {}).map(k => ({q:state.quotes[k], c:quoteCalc(state.quotes[k])}))
    .sort((a, b) => (a.c.amount || Infinity) - (b.c.amount || Infinity));
  const notes = [];
  const miss = missing();
  notes.push(miss.length ? "尚未填寫：" + miss.join("、") : "全部 " + CFG.classes.length + " 班皆已填寫");
  if(ds.length) notes.push("抽籤 " + ds.length + " 次："
    + ds.map(d => paletteName(d.hex) + "→" + drawWins(d).join("、")).join("、"));
  const outs = CFG.classes.filter(c => statusOf(c) === "out");
  if(outs.length) notes.push("需改選顏色：" + outs.join("、"));
  if(qs.length) notes.push("最低報價：" + (qs[0].q.name || "未署名") + " " + money(qs[0].c.amount)
    + "（平均每件 " + money(qs[0].c.avg) + "）");
  const H = top + tableH + 26 + notes.length * 17 + PAD;

  const cv = document.createElement("canvas");
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  const g = cv.getContext("2d");
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
  g.textBaseline = "middle";

  const txt = (s, x, y, font, color, align) => {
    g.font = font; g.fillStyle = color; g.textAlign = align || "center";
    g.fillText(s == null ? "" : String(s), x, y);
  };
  const clip = (s, max, font) => {
    g.font = font;
    s = String(s == null ? "" : s);
    if(g.measureText(s).width <= max) return s;
    let out = s;
    while(out.length > 1 && g.measureText(out + "…").width > max) out = out.slice(0, -1);
    return out + "…";
  };
  const box = (x, y, w, h, fill) => { g.fillStyle = fill; g.fillRect(x, y, w, h); };
  const line = (x1, y1, x2, y2, color, lw) => {
    g.strokeStyle = color; g.lineWidth = lw || 1;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  };

  const ss = schoolSizes();
  txt(sheetTitle(), W / 2, PAD + 22, '700 22px ' + FS, PC.ink);
  txt("已填 " + filled().length + " / " + CFG.classes.length + " 班　·　全校 " + ss.total
      + " 件　·　產出時間 " + fmtStamp(new Date()), W / 2, PAD + 50, '400 12.5px ' + FS, PC.dim);

  const xs = [];
  let x = PAD;
  COLS.forEach(c => { xs.push(x); x += c.w; });
  box(PAD, top, tableW, H1, PC.head);
  COLS.forEach((c, i) => txt(c.t, xs[i] + c.w / 2, top + H1 / 2, '600 12.5px ' + FS, PC.dim));

  CFG.classes.forEach((cls, r) => {
    const y = top + H1 + r * RH, mid = y + RH / 2;
    if(r % 2) box(PAD, y, tableW, RH, PC.rowh);
    const m = meta(cls);
    txt(cls, xs[0] + COLS[0].w / 2, mid, '600 14px ' + FM, PC.ink);
    if(!m){
      txt("尚未填寫", PAD + (tableW - COLS[0].w) / 2 + COLS[0].w, mid, '400 13px ' + FS, PC.faint);
      return;
    }
    /* 顏色 */
    const cw = COLS[1].w;
    box(xs[1] + 10, y + 10, 26, RH - 20, m.hex || "#eee");
    g.strokeStyle = "rgba(0,0,0,.2)"; g.lineWidth = 1;
    g.strokeRect(xs[1] + 10, y + 10, 26, RH - 20);
    txt(clip(paletteName(m.hex), cw - 50, '600 13px ' + FS), xs[1] + 44, mid - 7, '600 13px ' + FS, PC.ink, "left");
    txt(m.hex || "", xs[1] + 44, mid + 9, '400 11px ' + FM, PC.dim, "left");
    /* 款式 */
    txt(clip((m.sleeve || "") + " " + (m.neck || ""), COLS[2].w - 12, '400 12.5px ' + FS),
        xs[2] + COLS[2].w / 2, mid - 7, '400 12.5px ' + FS, PC.ink);
    txt("領袖口 " + trimName(m.trim), xs[2] + COLS[2].w / 2, mid + 9, '400 10.5px ' + FS, PC.dim);
    /* 試衣縮圖 */
    const im = imgs && imgs[cls];
    if(im && im.width){
      const bh = RH - 8, bw = bh * SHIRT_W / SHIRT_H;
      g.drawImage(im, xs[3] + (COLS[3].w - bw) / 2, y + 4, bw, bh);
    }else{
      txt("—", xs[3] + COLS[3].w / 2, mid, '400 13px ' + FS, PC.faint);
    }
    /* 尺寸 */
    const s = sizesOf(cls);
    CFG.sizes.forEach((k, i) => {
      const n = Number(s[k]) || 0;
      txt(n ? String(n) : "·", xs[4 + i] + COLS[4 + i].w / 2, mid, '400 13px ' + FM, n ? PC.ink : PC.faint);
    });
    const ti = 4 + CFG.sizes.length;
    txt(String(totalOf(cls)), xs[ti] + COLS[ti].w / 2, mid, '700 15px ' + FM, PC.ink);
    const st = STATUS[statusOf(cls)];
    const stk = statusOf(cls);
    txt(st.label, xs[ti + 1] + COLS[ti + 1].w / 2, mid, '600 12px ' + FS,
        stk === "out" ? PC.warn : (stk === "won" ? PC.good : "#a1670f"));
    g.textAlign = "left";
    txt(clip(m.note || "—", COLS[ti + 2].w - 14, '400 12px ' + FS), xs[ti + 2] + 8, mid,
        '400 12px ' + FS, m.note ? PC.dim : PC.faint, "left");
  });

  /* 合計列 */
  const sy = top + H1 + CFG.classes.length * RH;
  box(PAD, sy, tableW, RH, PC.head);
  txt("合計", xs[0] + COLS[0].w / 2, sy + RH / 2, '700 14px ' + FS, PC.ink);
  txt(filled().length + " 班已填", xs[1] + 10, sy + RH / 2, '400 12.5px ' + FS, PC.dim, "left");
  CFG.sizes.forEach((k, i) => {
    txt(String(ss[k]), xs[4 + i] + COLS[4 + i].w / 2, sy + RH / 2, '700 13.5px ' + FM, PC.ink);
  });
  const ti = 4 + CFG.sizes.length;
  txt(String(ss.total), xs[ti] + COLS[ti].w / 2, sy + RH / 2, '700 16px ' + FM, PC.ink);

  for(let r = 0; r <= rows; r++){
    const y = top + H1 + r * RH;
    line(PAD, y, PAD + tableW, y, r === 0 ? PC.line : PC.hair);
  }
  xs.forEach((x2, i) => { if(i) line(x2, top, x2, top + tableH, PC.hair); });
  g.strokeStyle = PC.line; g.lineWidth = 1.4;
  g.strokeRect(PAD, top, tableW, tableH);

  let yy = top + tableH + 18;
  notes.forEach((n, i) => {
    txt(clip(n, tableW, '400 11.5px ' + FS), W / 2, yy + i * 17, '400 11.5px ' + FS,
        (i === 0 && miss.length) ? PC.warn : PC.dim);
  });
  return cv;
}
async function canvasImage(cv){
  try{
    if(typeof CompressionStream === "function"){
      const px = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      const rgbb = new Uint8Array(cv.width * cv.height * 3);
      for(let i = 0, j = 0; i < px.length; i += 4){ rgbb[j++] = px[i]; rgbb[j++] = px[i+1]; rgbb[j++] = px[i+2]; }
      const st = new Blob([rgbb]).stream().pipeThrough(new CompressionStream("deflate"));
      const buf = new Uint8Array(await new Response(st).arrayBuffer());
      return {data:buf, filter:"/FlateDecode"};
    }
  }catch(e){}
  const b64 = cv.toDataURL("image/jpeg", 0.95).split(",")[1];
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return {data:u, filter:"/DCTDecode"};
}
function pdfFromCanvas(cv, img){
  const PW = 842, PH_ = 595, M = 20;
  const s = Math.min((PW - 2*M) / cv.width, (PH_ - 2*M) / cv.height);
  const w = cv.width * s, h = cv.height * s, x = (PW - w) / 2, y = (PH_ - h) / 2;
  const content = "q " + w.toFixed(2) + " 0 0 " + h.toFixed(2) + " " + x.toFixed(2) + " " + y.toFixed(2) + " cm /Im0 Do Q\n";
  const parts = []; let len = 0;
  const lat = str => { const a = new Uint8Array(str.length); for(let i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 0xFF; return a; };
  const put = u8 => { parts.push(u8); len += u8.length; };
  const off = [0];
  put(lat("%PDF-1.4\n%âãÏÓ\n"));
  const obj = (n, head, stream) => {
    off[n] = len;
    put(lat(n + " 0 obj\n" + head + "\n"));
    if(stream){ put(lat("stream\n")); put(stream); put(lat("\nendstream\n")); }
    put(lat("endobj\n"));
  };
  const enc = new TextEncoder();
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH_ + "]"
       + " /Resources << /ProcSet [/PDF /ImageC] /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>");
  const cs = enc.encode(content);
  obj(4, "<< /Length " + cs.length + " >>", cs);
  obj(5, "<< /Type /XObject /Subtype /Image /Width " + cv.width + " /Height " + cv.height
       + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter " + img.filter
       + " /Length " + img.data.length + " >>", img.data);
  const xref = len;
  let x2 = "xref\n0 6\n0000000000 65535 f \n";
  for(let i = 1; i <= 5; i++) x2 += String(off[i]).padStart(10, "0") + " 00000 n \n";
  x2 += "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
  put(lat(x2));
  const out = new Uint8Array(len);
  let p = 0; parts.forEach(c => { out.set(c, p); p += c.length; });
  return out;
}

/* ---------- 下載 ---------- */
async function offer(filename, data, mime){
  if(DL){
    try{ await DL.save({filename:filename, data:data}); toast("已儲存 " + filename); return true; }
    catch(e){
      const c = e && e.code;
      if(c === "declined") return false;
      if(c === "rejected_extension" || c === "extension_not_enabled"){
        toast("這個檢視不允許下載 ." + filename.split(".").pop() + "，請改用其他格式");
        return false;
      }
      if(c !== "unavailable" && c !== "not_granted" && c !== "capability_disabled" && c !== "capability_removed"){
        toast("下載失敗：" + (e.message || c)); return false;
      }
    }
  }
  try{
    const blob = new Blob([data], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast("已下載 " + filename);
    return true;
  }catch(e){ toast("下載失敗：" + e.message); return false; }
}

};
