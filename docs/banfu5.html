    ["fSleeve","fNeck","fNote","btnArtFront","btnArtBack","btnSave","btnCopy","btnClearMine",
     "btnShirtPng","rW","rY","rX"].forEach(id => {
      const e = document.getElementById(id); if(e) e.disabled = dis;
    });
    CFG.sizes.forEach(k => { const e = document.getElementById("sz_" + k); if(e) e.disabled = dis; });
    document.querySelectorAll("#artPresets .pbtn").forEach(b => { b.disabled = dis; });
  }
  renderCards();
  if(VIEW.key === "admin"){ renderDraw(); renderCheck(); renderSizeTable(); renderCompare(); }
  if(VIEW.key === "vendor"){ renderSizeTable(); renderQuote(); }
  renderSync();          /* 快照回來時 mode 才變 fire，狀態列要跟著重畫 */
}
function debounce(fn, ms){
  let t = null;
  return function(){
    const a = arguments;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(null, a), ms);
  };
}
const saveQuote = debounce(saveQuoteNow, 900);
function saveQuoteNow(){
  const q = quoteDraft();
  const rec = {name:(q.name || "").trim().slice(0, 20),
               contact:(q.contact || "").trim().slice(0, 30),
               valid:(q.valid || "").trim().slice(0, 20),
               big:num(q.big, 9999),
               note:(q.note || "").trim().slice(0, 200),
               items:{}, at:new Date().toISOString()};
  CFG.classes.forEach(c => {
    const it = (q.items && q.items[c]) || {};
    const u = num(it.unit, 99999), p = num(it.plate, 999999);
    if(u || p) rec.items[c] = {unit:u, plate:p};
  });
  if(!rec.name && !rec.note && !Object.keys(rec.items).length) return;   /* 空報價就先不要建立 */
  const k = vendorId();
  QDat = rec.at;
  commit(d => { d.quotes = d.quotes || {}; d.quotes[k] = rec; });
}
/** 需要再按一次確認的按鈕，避免手滑清掉別人的填寫 */
function armed(btn, label, run){
  btn.addEventListener("click", () => {
    if(btn.dataset.armed !== "1"){
      btn.dataset.armed = "1"; btn.textContent = "再按一次確認";
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.dataset.armed = "0"; btn.textContent = label; }, 4000);
      return;
    }
    clearTimeout(btn._t); btn.dataset.armed = "0"; btn.textContent = label;
    run();
  });
}
async function readArt(f, input){
  if(!me || !draft){ toast("請先選擇你的班級"); return; }
  const file = input.files && input.files[0];
  input.value = "";
  if(!file) return;
  if(SYNC.mode === "shared"){ toast("Artifact 模式無法上傳圖案，請走 GitHub Pages 網址"); return; }
  toast("處理圖檔中…");
  try{
    const img = await pickArt(file);
    draft.imgs[f] = img;
    draft.drop[f] = false;
    face = f;
    renderFit();
    toast((f === "front" ? "正面" : "背面") + "圖案已載入，按「送出 / 更新」才會存到雲端"
      + (img.alpha ? "（保留透明背景）" : ""));
  }catch(e){
    toast("圖檔讀取失敗：" + (e.message || "格式不支援"));
  }
}
function wire(){
  /* 款式 */
  const bind = (id, key) => {
    const e = document.getElementById(id);
    if(!e) return;
    e.addEventListener("change", () => { if(draft){ draft[key] = e.value; renderFit(); } });
  };
  bind("fSleeve", "sleeve");
  bind("fNeck", "neck");
  const note = document.getElementById("fNote");
  if(note) note.addEventListener("input", () => { if(draft) draft.note = note.value; });
  /* 試衣間 */
  ["front","back"].forEach(f => {
    const fig = document.getElementById(f === "front" ? "fitFront" : "fitBack");
    if(!fig) return;
    fig.addEventListener("click", () => { face = f; renderFit(); });
    fig.addEventListener("keydown", ev => {
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); face = f; renderFit(); }
    });
  });
  [["rW","w"], ["rY","y"], ["rX","x"]].forEach(p => {
    const e = document.getElementById(p[0]);
    if(!e) return;
    e.addEventListener("input", () => {
      if(!draft) return;
      draft.art[face][p[1]] = Number(e.value);
      renderFit();
    });
  });
  document.querySelectorAll("#artPresets .pbtn").forEach(b => {
    b.addEventListener("click", () => {
      if(!draft) return;
      draft.art[face] = Object.assign({}, ART_PRESETS[b.dataset.preset] || ART_PRESETS.chest);
      renderFit();
    });
  });
  const af = document.getElementById("fArtFront"), ab = document.getElementById("fArtBack");
  if(af){
    document.getElementById("btnArtFront").addEventListener("click", () => af.click());
    document.getElementById("btnArtBack").addEventListener("click", () => ab.click());
    af.addEventListener("change", () => readArt("front", af));
    ab.addEventListener("change", () => readArt("back", ab));
    document.getElementById("btnArtClear").addEventListener("click", () => {
      if(!draft) return;
      draft.imgs[face] = null;
      draft.drop[face] = true;
      renderFit();
      toast((face === "front" ? "正面" : "背面") + "圖案已移除，按「送出 / 更新」才會生效");
    });
    document.getElementById("btnShirtPng").addEventListener("click", async ev => {
      const b = ev.currentTarget, t = b.textContent;
      b.disabled = true; b.textContent = "產生中…";
      try{
        await offer(fileBase() + "_" + (me || "試衣") + "_" + fileStamp() + ".png",
          await buildShirtPng(null), "image/png");
      }catch(e){ toast("試衣圖產生失敗：" + e.message); }
      finally{ b.disabled = false; b.textContent = t; }
    });
  }

  /* 班級端送出 */
  const bs = document.getElementById("btnSave");
  if(bs){
    bs.addEventListener("click", async ev => {
      const b = ev.currentTarget;
      b.disabled = true;
      try{ await saveMine(); }finally{ b.disabled = !me; }
    });
    document.getElementById("btnCopy").addEventListener("click", () => {
      if(!me) return;
      const t = myText(me);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(() => toast("已複製 " + me + " 班的填寫"),
                                             () => toast("複製失敗，請手動選取"));
      }else{ toast("這個瀏覽器不支援複製"); }
    });
    armed(document.getElementById("btnClearMine"), "清除我班的填寫", async () => {
      if(!me) return;
      const ok = await commit(d => { delete d.classes[me]; });
      if(ok){ draft = newDraft(me, true); renderAll(); toast(me + " 班的填寫已清除"); }
    });
  }

  /* 承辦：撤銷抽籤 */
  const bu = document.getElementById("btnUndoDraw");
  if(bu){
    armed(bu, "撤銷最近一次抽籤", async () => {
      const ok = await commit(d => {
        if(!(d.draws || []).length) refuse("目前沒有抽籤紀錄");
        d.draws = d.draws.slice(0, -1);
      });
      if(ok) toast("已撤銷最近一次抽籤，該色回到待抽籤狀態");
    });
  }

  /* 廠商：報價 */
  const qn = document.getElementById("qName");
  if(qn){
    [["qName","name"], ["qContact","contact"], ["qValid","valid"], ["qNote","note"]].forEach(p => {
      const e = document.getElementById(p[0]);
      e.addEventListener("input", () => { quoteDraft()[p[1]] = e.value; renderQuote(); saveQuote(); });
    });
    const qb = document.getElementById("qBig");
    qb.addEventListener("input", () => { quoteDraft().big = num(qb.value, 9999); renderQuote(); saveQuote(); });
    document.getElementById("btnApplyBase").addEventListener("click", () => {
      const v = num(document.getElementById("qBase").value, 99999);
      if(!v){ toast("先填共同單價"); return; }
      CFG.classes.forEach(c => { if(meta(c)) qItem(c).unit = v; });
      renderQuote(); saveQuoteNow();
      toast("已把 " + v + " 元帶入所有已填寫的班級");
    });
    armed(document.getElementById("btnClearQuote"), "清除我的報價", async () => {
      const k = vendorId();
      const ok = await commit(d => {
        if(!d.quotes || !d.quotes[k]) refuse("你還沒有送出過報價");
        delete d.quotes[k];
      });
      if(ok){
        QD = {name:"", contact:"", valid:"", big:0, note:"", items:{}};
        QDat = "";
        renderQuote();
        toast("已清除這份報價");
      }
    });
    document.getElementById("btnQuotePdf").addEventListener("click", async ev => {
      const b = ev.currentTarget, t = b.textContent;
      b.disabled = true; b.textContent = "產生中…";
      try{
        await offer(fileBase() + "_報價單_" + fileStamp() + ".pdf", await buildQuotePdf(), "application/pdf");
      }catch(e){ toast("PDF 產生失敗：" + e.message); }
      finally{ b.disabled = false; b.textContent = t; }
    });
  }

  /* 匯出 */
  const bx = document.getElementById("btnXlsx");
  if(bx){
    bx.addEventListener("click", async ev => {
      const b = ev.currentTarget; b.disabled = true;
      try{
        await offer(fileBase() + "_" + fileStamp() + ".xlsx", buildXlsx(),
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      }finally{ b.disabled = false; }
    });
    document.getElementById("btnCsv").addEventListener("click", async ev => {
      const b = ev.currentTarget; b.disabled = true;
      try{ await offer(fileBase() + "_" + fileStamp() + ".csv", buildCsv(), "text/csv;charset=utf-8"); }
      finally{ b.disabled = false; }
    });
    document.getElementById("btnPdf").addEventListener("click", async ev => {
      const b = ev.currentTarget, t = b.textContent;
      b.disabled = true; b.textContent = "產生中…";
      try{ await offer(fileBase() + "_" + fileStamp() + ".pdf", await buildPdf(), "application/pdf"); }
      catch(e){ toast("PDF 產生失敗：" + e.message); }
      finally{ b.disabled = false; b.textContent = t; }
    });
    document.getElementById("btnPrint").addEventListener("click", () => {
      try{ window.print(); }catch(e){ toast("此檢視無法直接列印，請改用匯出 PDF"); }
    });
  }

  /* 放大檢視 */
  const lb = document.getElementById("lightbox");
  lb.addEventListener("click", () => lb.classList.remove("show"));
  document.addEventListener("keydown", ev => { if(ev.key === "Escape") lb.classList.remove("show"); });
}

applyView();
loadLocal();
buildSizeGrid();
renderStyleOptions();
renderAll();
wire();
initRuntime();
</script>
<!--
  ═══════════════════════════════════════════════════════════════
  開啟即時共用（GitHub Pages 必要步驟）

  1. 上面的 FIREBASE_CONFIG 填入 Firebase 專案設定
     （主控台 → 專案設定 → 一般 → 網頁應用程式 → firebaseConfig）
     目前沿用 banfu.html 那個專案，Firestore 資料庫已經建立過，
     所以只差下面這一步規則。
  2. Firestore → 規則，把下面這兩段「加進」現有規則最外層的
       match /databases/{database}/documents { … }
     大括號裡，其他既有 match 區塊（含 yearbookShirt）原封不動保留。
     Firestore 規則逐路徑判斷、預設全部拒絕，新增這兩段不會影響同一
     專案裡其他集合的權限。

      match /classShirt/{docId} {
        allow read:  if docId == '115-5';
        allow write: if docId == '115-5'
          && request.resource.data.keys().hasOnly(['classes', 'draws', 'quotes', 'updated', 'v'])
          && request.resource.data.classes is map
          && request.resource.data.classes.size() <= 20
          && request.resource.data.draws is list
          && request.resource.data.draws.size() <= 60
          && request.resource.data.quotes is map
          && request.resource.data.quotes.size() <= 20
          && request.resource.data.updated is string
          && request.resource.data.updated.size() <= 40;
      }

      match /classShirt/{docId}/art/{key} {
        allow read:  if docId == '115-5';
        allow write: if docId == '115-5'
          && request.resource.data.keys().hasOnly(['full', 'thumb', 'at', 'by'])
          && request.resource.data.full is string
          && request.resource.data.full.size() <= 740000
          && request.resource.data.thumb is string
          && request.resource.data.thumb.size() <= 130000
          && request.resource.data.at is string
          && request.resource.data.at.size() <= 40;
      }

  三處的 classShirt / 115-5 要和程式裡的 FIRE_COL / FIRE_ID 一致。
  下一屆換一個 FIRE_ID（例如 116-5），規則跟著改，舊資料留在原文件。

  這份文件是公開可寫的（掃 QR 的導師與廠商都不需登入）。規則把範圍鎖在
  單一文件、20 筆班級、60 筆抽籤、20 家報價以內，只有指定欄位，
  單張圖案上限約 720KB，就算有人亂寫也只影響這張表，隨時可重填。
  刪掉這兩段 match 即可關閉即時共用。

  註一：抽籤紀錄是附加式的陣列，撤銷抽籤是「拿掉最後一筆」，
  規則不區分新增與刪除，所以承辦端的撤銷鍵刻意加了二次確認。
  註二：清除某班填寫時主文件紀錄會消失，子集合裡的舊圖案仍留著
  （規則刻意不允許刪除，避免誤刪）。畫面只認主文件的 frontAt / backAt，
  孤兒圖案不會顯示，該班重新上傳時會直接覆蓋。
  ═══════════════════════════════════════════════════════════════
-->
