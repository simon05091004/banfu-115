<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社會第三單元檢核卷　導師檢核</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#F4F8F2; --paper-2:#FFFFFF; --paper-3:#EAF1E8;
  --grid:#D6E6D8; --line:#C4D6C7; --hair:#DFEADF;
  --ink:#1C2B30; --ink-soft:#56686D; --ink-faint:#8A9A9C;
  --red:#CE3E2E; --red-bg:#FBE6E1;
  --blue:#2A6B8C; --blue-bg:#DCEAF1;
  --leaf:#3B8A58; --leaf-bg:#DFEFE3;
  --gold:#D99A12; --gold-bg:#FBF0D8;
  --btn-shadow:0 2px 0 var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#1D2823; --paper-2:#25322C; --paper-3:#2C3A33;
    --grid:#33443B; --line:#3C4E45; --hair:#334138;
    --ink:#E8EFE5; --ink-soft:#A9BCB1; --ink-faint:#7C9086;
    --red:#F1897A; --red-bg:#3C2A28;
    --blue:#7CC2DD; --blue-bg:#233841;
    --leaf:#7FD3A1; --leaf-bg:#22382C;
    --gold:#EFC463; --gold-bg:#3A3222;
    --btn-shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#1D2823; --paper-2:#25322C; --paper-3:#2C3A33;
  --grid:#33443B; --line:#3C4E45; --hair:#334138;
  --ink:#E8EFE5; --ink-soft:#A9BCB1; --ink-faint:#7C9086;
  --red:#F1897A; --red-bg:#3C2A28;
  --blue:#7CC2DD; --blue-bg:#233841;
  --leaf:#7FD3A1; --leaf-bg:#22382C;
  --gold:#EFC463; --gold-bg:#3A3222;
  --btn-shadow:0 2px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Heiti TC",sans-serif;
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
  background-image:
    repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 28px);
}
button{font:inherit; color:inherit; touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.num{font-family:"IBM Plex Mono","SF Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.app{max-width:1080px; margin:0 auto; padding:0 18px 60px}

.bar{display:flex; align-items:center; gap:12px; padding:16px 0 12px; border-bottom:1px solid var(--line); margin-bottom:18px; flex-wrap:wrap}
.brand{font-family:"Noto Serif TC",serif; font-weight:900; font-size:19px; letter-spacing:.04em}
.brand span{color:var(--red)}
.brand em{font-style:normal; font-family:"Noto Sans TC",sans-serif; font-weight:500; font-size:13px; color:var(--ink-soft); letter-spacing:.14em; margin-left:10px}
.bar .sp{margin-left:auto}
.icon-btn{border:1px solid var(--line); background:var(--paper-2); border-radius:8px; min-height:38px; padding:0 12px; cursor:pointer; font-size:14px; color:var(--ink-soft)}

h1{font-family:"Noto Serif TC",serif; font-weight:900; font-size:28px; margin:0 0 8px}
h2{font-family:"Noto Serif TC",serif; font-weight:700; font-size:20px; margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--ink-soft)}
.small{font-size:13.5px}
.eyebrow{font-size:12px; letter-spacing:.2em; color:var(--ink-soft); margin:0 0 8px; font-weight:500}

.btn{border:1.5px solid var(--ink); background:var(--ink); color:var(--paper-2); padding:10px 18px; font-weight:700; font-size:15px; cursor:pointer; border-radius:4px; min-height:44px; box-shadow:var(--btn-shadow)}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.red{background:var(--red); border-color:var(--red); color:#fff}
.btn:disabled{opacity:.4; cursor:not-allowed}

/* 登入 */
.gate{max-width:400px; margin:8vh auto 0; background:var(--paper-2); border:1px solid var(--line); border-top:5px solid var(--red); padding:28px}
.gate label{display:block; font-size:13px; letter-spacing:.08em; color:var(--ink-soft); margin:14px 0 5px}
.gate input{width:100%; font:inherit; font-size:16px; padding:11px 13px; min-height:46px; border:2px solid var(--line); background:var(--paper); color:var(--ink); border-radius:4px}
.gate input:focus{border-color:var(--blue); outline:none}
.gate .btn{width:100%; margin-top:20px}
.err{color:var(--red); font-size:13.5px; font-weight:700; min-height:22px; margin-top:10px}

/* 班級頁籤 */
.tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
.tab{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:16px; min-height:46px; padding:0 14px; cursor:pointer; border:1.5px solid var(--line); background:var(--paper-2); color:var(--ink-soft); border-radius:5px; position:relative}
.tab[aria-selected="true"]{background:var(--red); border-color:var(--red); color:#fff}
.tab i{display:block; font-style:normal; font-family:"Noto Sans TC",sans-serif; font-size:10.5px; font-weight:500; letter-spacing:.04em; opacity:.85}

/* 摘要 */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:20px}
.tiles div{background:var(--paper-2); padding:14px 16px}
.tiles dt{font-size:11.5px; letter-spacing:.14em; color:var(--ink-soft); margin-bottom:3px}
.tiles dd{margin:0; font-family:"IBM Plex Mono",monospace; font-size:27px; font-weight:700; line-height:1.15}
.tiles dd small{font-size:14px; color:var(--ink-faint); font-weight:500}

/* 表格 */
.qbars{border:1px solid var(--line); background:var(--paper-2); padding:14px 16px; margin-bottom:20px}
.qbars h3{font-size:12px; letter-spacing:.14em; color:var(--ink-soft); margin:0 0 10px; font-weight:700}
.qbars .worst{color:var(--red); font-weight:700; font-size:14px; margin:0 0 12px}
.qbars ol{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.qbars li{display:grid; grid-template-columns:2.4em 1fr 4.5em; align-items:center; gap:10px; font-size:12.5px}
.qbars .qn{font-family:"IBM Plex Mono",monospace; color:var(--ink-soft); text-align:right}
.qbars .track{height:15px; background:var(--paper-3); border-radius:3px; overflow:hidden}
.qbars .fill{display:block; height:100%; background:var(--red); opacity:.8; min-width:3px}
.qbars .fill.zero{background:var(--leaf); opacity:.35}
.qbars .cnt{font-family:"IBM Plex Mono",monospace; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.qbars .qlabel{font-size:11px; color:var(--ink-faint)}
.tablewrap{overflow-x:auto; border:1px solid var(--line); background:var(--paper-2); margin-bottom:18px}
table{border-collapse:collapse; width:100%; min-width:760px}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--hair); white-space:nowrap}
th{background:var(--paper-3); font-size:12px; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; position:sticky; top:0}
td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--paper-3)}
tr.miss td{color:var(--ink-faint)}
.seatcell{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:17px}
.pill{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.05em; padding:2px 8px; border-radius:10px; border:1.5px solid}
.pill.done{color:var(--leaf); border-color:var(--leaf); background:var(--leaf-bg)}
.pill.none{color:var(--ink-faint); border-color:var(--line); background:transparent}
.pill.warn{color:var(--gold); border-color:var(--gold); background:var(--gold-bg)}
.stars-mini{color:var(--gold); letter-spacing:2px; font-size:15px}
.stars-mini u{color:var(--line); text-decoration:none}
.wrongq{color:var(--red); font-weight:700}

/* 明細 */
tr.detail td{background:var(--paper-3); padding:0; border-bottom:2px solid var(--line)}
.detailbox{padding:14px 18px}
.qgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:8px; margin-top:10px}
.qcard{border:1.5px solid var(--line); background:var(--paper-2); padding:8px 10px; border-radius:5px;
       white-space:normal; word-break:break-word}
.detailbox{white-space:normal}
.qcard.bad{border-color:var(--red)}
.qcard b{font-family:"IBM Plex Mono",monospace; font-size:15px; display:block}
.qcard span{font-size:11.5px; color:var(--ink-soft); display:block; line-height:1.5}
.attempts{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.delrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line)}
.del-rec{border:1.5px solid var(--red); background:transparent; color:var(--red); font-size:13.5px; font-weight:700; padding:7px 14px; min-height:38px; border-radius:4px; cursor:pointer}
.del-rec:hover{background:var(--red-bg)}
.del-rec:disabled{opacity:.5; cursor:not-allowed}
.att{border:1.5px solid var(--line); background:var(--paper-2); padding:4px 10px; border-radius:4px; font-size:12.5px; cursor:pointer}
.att[aria-pressed="true"]{border-color:var(--blue); background:var(--blue-bg); color:var(--blue); font-weight:700}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px}
.sizefield{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-soft)}
.sizefield input{width:64px; font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; padding:8px 10px; min-height:42px; text-align:center; border:1.5px solid var(--line); background:var(--paper-2); color:var(--ink); border-radius:4px}
.status{font-size:13px; color:var(--ink-soft); min-height:22px; margin-bottom:14px}
.empty{padding:44px 20px; text-align:center; color:var(--ink-faint); background:var(--paper-2); border:1px dashed var(--line)}
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:var(--paper-2); padding:11px 20px; border-radius:6px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .25s; z-index:9}
#toast.on{opacity:1}
@media (max-width:520px){ .app{padding:0 12px 44px} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand" id="brand"></div>
    <span class="sp"></span>
    <button class="icon-btn" id="theme" title="切換亮／暗">◐</button>
    <button class="icon-btn" id="signout" hidden>登出</button>
  </header>

  <!-- 登入 -->
  <section id="gate" class="gate" hidden>
    <p class="eyebrow">教師專用</p>
    <h1 style="font-size:24px">請先登入</h1>
    <p class="small muted">學生的成績只有登入後才看得到。帳號密碼請向 603 導師索取。</p>
    <label for="em">教師帳號</label>
    <input id="em" type="email" autocomplete="username" placeholder="teacher@banfu.local">
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="signin">登入</button>
    <p class="err" id="gate-err"></p>
  </section>

  <!-- 主畫面 -->
  <section id="board" hidden>
    <div class="tabs" id="tabs" role="tablist"></div>
    <dl class="tiles" id="tiles"></dl>
    <div class="toolbar">
      <button class="btn" id="pdf-class">匯出本班 PDF</button>
      <button class="btn ghost" id="pdf-all">匯出全年級 PDF</button>
      <button class="btn ghost" id="pdf-paper">匯出學生卷</button>
      <button class="btn ghost" id="pdf-key">匯出教師答案</button>
      <button class="btn ghost" id="reload">重新整理</button>
      <span class="sizefield"><label for="size">班級人數</label><input id="size" type="number" min="1" max="40" value="30"></span>
    </div>
    <p class="status" id="status"></p>
    <div class="qbars" id="qbars" hidden></div>
    <div id="table-host"></div>
  </section>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ================= 設定 ================= */
/* ============================================================
   設定區：要和 quiz-game.html 的設定對應，尤其是 classes 和 FIRE_COL

                    "607":24,"608":25,"609":25,"610":26,"611":25};

 "0": "一、是非題（每題 2 分，共 20 分）對的選①，錯的選②",

/* ================= Firebase ================= */
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){ rej(new Error(src)); };
    document.head.appendChild(s);
  });
}
async function boot(){
  try{
    await loadScript(FIRE_SDK+'firebase-app-compat.js');
    await loadScript(FIRE_SDK+'firebase-auth-compat.js');
    await loadScript(FIRE_SDK+'firebase-firestore-compat.js');
  }catch(e){
    $('gate').hidden=false;
    $('gate-err').textContent='載入不到 Firebase 元件，請檢查網路。';
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH=firebase.auth(); DB=firebase.firestore();
  AUTH.onAuthStateChanged(function(u){
    if(u){ $('gate').hidden=true; $('board').hidden=false; $('signout').hidden=false; load(); }
    else { $('gate').hidden=false; $('board').hidden=true; $('signout').hidden=true; }
  });
}

  if(!em || !pw){ $('gate-err').textContent='帳號和密碼都要填。'; return; }
  $('gate-err').textContent=''; $('signin').disabled=true; $('signin').textContent='登入中…';
  try{ await AUTH.signInWithEmailAndPassword(em,pw); }
  catch(e){
    var c=e && e.code, msg='登入失敗，請再試一次。';
    if(c==='auth/invalid-email') msg='帳號格式不對。';
    else if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found') msg='帳號或密碼不對。';
    else if(c==='auth/too-many-requests') msg='嘗試太多次，請等幾分鐘再試。';
    else if(c==='auth/operation-not-allowed') msg='Firebase 尚未啟用「電子郵件/密碼」登入方式。';
    else if(c==='auth/network-request-failed') msg='連不到網路。';
    $('gate-err').textContent=msg;
  }
  $('signin').disabled=false; $('signin').textContent='登入';
};

async function load(){
  $('status').textContent='讀取中…';
  try{
    var snap = await DB.collection(FIRE_COL).get();
    DATA={};
    CLASSES.forEach(function(c){ DATA[c]={}; });
    snap.forEach(function(doc){
      var d=doc.data();
      if(!d || !d.cls || !DATA[d.cls]) return;
      var seat=Number(d.seat);
      if(!(seat>=1)) return;
      d._id = doc.id;
      (DATA[d.cls][seat] = DATA[d.cls][seat] || []).push(d);
    });
    Object.keys(DATA).forEach(function(c){
      Object.keys(DATA[c]).forEach(function(s){
        DATA[c][s].sort(function(a,b){ return String(b.ts).localeCompare(String(a.ts)); });
        DATA[c][s] = DATA[c][s].slice(0, KEEP);
      });
    });
    $('status').textContent='資料時間 '+fmtStamp(new Date());
    render();
  }catch(e){
    $('status').textContent = (e && e.code==='permission-denied')
      ? '讀取被拒。Firestore 規則還沒開放給登入的老師讀 '+FIRE_COL+'。'
      : '讀取失敗：'+(e && e.message || e);
  }
}
$('reload').onclick=load;

/* ================= 統計 ================= */
function rowsFor(cls){
  var size=classSize(cls), out=[];
  for(var s=1;s<=size;s++){
    var att = (DATA[cls] && DATA[cls][s]) || [];
    var best = att.reduce(function(m,a){ return (!m || a.score>m.score) ? a : m; }, null);
    out.push({seat:s, att:att, best:best, latest:att[0]||null});
  }
  /* 座號超出設定人數但有作答的，補在後面 */
  Object.keys((DATA[cls]||{})).map(Number).filter(function(s){ return s>size; }).sort(function(a,b){return a-b;})
    .forEach(function(s){
      var att=DATA[cls][s];
      var best=att.reduce(function(m,a){ return (!m||a.score>m.score)?a:m; }, null);
      out.push({seat:s, att:att, best:best, latest:att[0]||null, extra:true});
    });
  return out;
}
function statsFor(cls){
  var rows=rowsFor(cls);
  var done=rows.filter(function(r){ return r.att.length; });
  var avg = done.length ? Math.round(done.reduce(function(m,r){ return m+r.best.score; },0)/done.length) : 0;
  var perf= done.length ? Math.round(done.reduce(function(m,r){ return m+r.best.perfect; },0)/done.length*10)/10 : 0;
  /* 各題答錯人數：導師要的不只是「誰不會」，更是「全班哪一題最卡」，
     那決定下一節課要重講什麼 */
  var qs=[];
  done.forEach(function(r){
    (r.best.detail||[]).forEach(function(d,i){
      qs[i] = qs[i] || {i:i+1, q:d.q, wrong:0};
      if(d.m>0) qs[i].wrong++;
    });
  });
  var worst = qs.slice().sort(function(a,b){ return b.wrong-a.wrong; })[0] || null;
  if(worst && worst.wrong===0) worst=null;
  return {rows:rows, size:rows.filter(function(r){return !r.extra;}).length, done:done.length, avg:avg, perf:perf,
          qs:qs, worst:worst,
          missing:rows.filter(function(r){ return !r.att.length; }).map(function(r){ return r.seat; })};
}
function starText(n){ return '★'.repeat(n) + '<u>' + '★'.repeat(3-n) + '</u>'; }
function wrongList(rec){
  if(!rec || !rec.detail) return [];
  var out=[];
  rec.detail.forEach(function(d,i){ if(d.m>0) out.push(i+1); });
  return out;
}
function qTotal(){
  var n=0;
  CLASSES.forEach(function(c){
    Object.keys(DATA[c]||{}).forEach(function(s){
      (DATA[c][s]||[]).forEach(function(a){ n=Math.max(n,(a.detail||[]).length); });
    });
  });
  return n||QUESTION_COUNT;
}

/* ================= PDF：畫 A4 直式表格 ================= */
const PC={ ink:"#1e2b30", dim:"#56686d", faint:"#96a4a6", line:"#b9cbbd", hair:"#dbe6dc",
           head:"#eaf1e8", red:"#ce3e2e", leaf:"#3b8a58" };
const FS='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const FM='"IBM Plex Mono",ui-monospace,Menlo,monospace';
const ROWS_PER_PAGE = 30;

function classPages(cls){
  var st=statsFor(cls), rows=st.rows, pages=[], i;
  for(i=0;i<rows.length;i+=ROWS_PER_PAGE) pages.push(rows.slice(i,i+ROWS_PER_PAGE));
  if(!pages.length) pages.push([]);
  return pages.map(function(chunk,idx){ return {cls:cls, st:st, rows:chunk, page:idx+1, pages:pages.length}; });
}
function drawPage(spec, scale){
  var W=595, H=842, PAD=38;

  cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
  var g=cv.getContext('2d');
  g.setTransform(scale,0,0,scale,0,0);
  g.fillStyle="#ffffff"; g.fillRect(0,0,W,H);
  function txt(t,x,y,font,color,align){
    g.font=font; g.fillStyle=color; g.textAlign=align||'left'; g.textBaseline='middle';
    g.fillText(String(t),x,y);
  }
  function line(x1,y1,x2,y2,c,w){ g.strokeStyle=c; g.lineWidth=w||.7; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }

  txt(SCHOOL, PAD, PAD+2, '500 10px '+FS, PC.dim);
  txt(spec.cls+' 班', W-PAD, PAD+2, '700 15px '+FM, PC.red, 'right');
  txt(TITLE, PAD, PAD+26, '700 17px '+FS, PC.ink);

  var st=spec.st;

    {k:'stars', t:'星等', w:44, a:'center'},

    {k:'wrong', t:'答錯題號', w:88, a:'left'},

  ];
  var tableW=W-PAD*2, used=cols.reduce(function(m,c){ return m+c.w; },0);
  cols[cols.length-1].w = tableW-used;

  var top=PAD+72, RH=21;
  g.fillStyle=PC.head; g.fillRect(PAD, top, tableW, RH);
  cols.forEach(function(c,i){
    var cx = c.a==='center' ? xs[i]+c.w/2 : xs[i]+7;
    txt(c.t, cx, top+RH/2, '700 9.5px '+FS, PC.dim, c.a==='center'?'center':'left');
  });

  spec.rows.forEach(function(r,ri){
    var y=top+RH+ri*RH, mid=y+RH/2;

    var b=r.best, has=r.att.length>0, wl=wrongList(b);
    var vals = has ? {
      seat:r.seat, state:'已完成', n:r.att.length, score:b.score,

      wrong: wl.length?wl.join('、'):'無', when:fmtStamp(new Date(r.latest.ts))
    } : { seat:r.seat, state:'未作答', n:'—', score:'—', stars:'—', perf:'—', secs:'—', wrong:'—', when:'—' };
    cols.forEach(function(c,i){

  if(spec.page===spec.pages && st.missing.length){
    txt('尚未作答座號：'+st.missing.join('、'), PAD, fy, '400 9.5px '+FS, PC.red);
    fy+=15;
  }
  txt('第 '+spec.page+' / '+spec.pages+' 頁', W-PAD, H-PAD, '400 9px '+FS, PC.faint, 'right');
  if(QUESTION_NOTE) txt(QUESTION_NOTE, PAD, H-PAD, '400 8.5px '+FS, PC.faint);
  return cv;
}

async function canvasImage(cv){
  try{
    if(typeof CompressionStream==='function'){
      var px=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;
      var rgb=new Uint8Array(cv.width*cv.height*3);
      for(var i=0,j=0;i<px.length;i+=4){ rgb[j++]=px[i]; rgb[j++]=px[i+1]; rgb[j++]=px[i+2]; }
      var st=new Blob([rgb]).stream().pipeThrough(new CompressionStream('deflate'));
      var buf=new Uint8Array(await new Response(st).arrayBuffer());
      return {data:buf, filter:'/FlateDecode'};
    }
  }catch(e){}
  var b64=cv.toDataURL('image/jpeg',0.94).split(',')[1];
  var bin=atob(b64), u=new Uint8Array(bin.length);
  for(var k=0;k<bin.length;k++) u[k]=bin.charCodeAt(k);
  return {data:u, filter:'/DCTDecode'};
}

async function buildPdf(canvases){
  var M=0;
  var imgs=[];
  for(var i=0;i<canvases.length;i++) imgs.push(await canvasImage(canvases[i]));

  var parts=[], len=0, off=[];
  var lat=function(s){ var a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i)&0xFF; return a; };
  var put=function(u){ parts.push(u); len+=u.length; };
  var obj=function(n,head,stream){
    off[n]=len;
    put(lat(n+' 0 obj\n'+head+'\n'));
    if(stream){ put(lat('stream\n')); put(stream); put(lat('\nendstream\n')); }
    put(lat('endobj\n'));
  };
  var enc=new TextEncoder();
  put(lat('%PDF-1.4\n%âãÏÓ\n'));

  var N=canvases.length, kids=[];
  for(var p=0;p<N;p++) kids.push((3+p*3)+' 0 R');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
  for(var p2=0;p2<N;p2++){
    var pg=3+p2*3, ct=pg+1, im=pg+2;
    var PW=canvases[p2]._pw||595, PH=canvases[p2]._ph||842;
    var content='q '+PW+' 0 0 '+PH+' '+M+' '+M+' cm /Im0 Do Q\n';
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+']'
        +' /Resources << /ProcSet [/PDF /ImageC] /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>');
    var cs=enc.encode(content);
    obj(ct,'<< /Length '+cs.length+' >>', cs);
    obj(im,'<< /Type /XObject /Subtype /Image /Width '+canvases[p2].width+' /Height '+canvases[p2].height
        +' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter '+imgs[p2].filter
        +' /Length '+imgs[p2].data.length+' >>', imgs[p2].data);
  }
  var total=2+N*3, xref=len;
  var x2='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(var q=1;q<=total;q++) x2 += String(off[q]||0).padStart(10,'0')+' 00000 n \n';
  x2 += 'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  put(lat(x2));
  var out=new Uint8Array(len), pos=0;
  parts.forEach(function(c){ out.set(c,pos); pos+=c.length; });
  return out;
}


/* ================= 紙本練習題（補考用） ================= */
/* 沿用同一套 canvas → 點陣 → PDF，中文不必嵌字型，學校任何一台印表機都印得出來 */

/* 標題去掉結尾的「…紀錄」：闖關紀錄／檢核卷紀錄／綜合卷紀錄都適用，
   新單元換名字時不必再回來改這裡 */
function paperTitle(){ return TITLE.replace(/\s*\S*紀錄$/, ''); }

function paperQuestions(){
  if(PAPER_QS && PAPER_QS.length) return PAPER_QS.slice();
  /* 沒填設定就從已交的資料推導，取題數最多的那一份當範本 */
  var best=null;
  CLASSES.forEach(function(c){
    Object.keys(DATA[c]||{}).forEach(function(s){
      (DATA[c][s]||[]).forEach(function(a){
        if(a.detail && (!best || a.detail.length>best.length)) best=a.detail;
      });
    });
  });
  return best ? best.map(function(d){ return {q:d.q, a:d.a}; }) : [];
}

/* 題目長得像「A 和 B」時，順便把短除法的除數算出來放進答案頁 */
function paperSteps(qtext){
  var m=/^\s*(\d+)\s*和\s*(\d+)\s*$/.exec(qtext||"");
  if(!m) return null;
  var x=+m[1], y=+m[2], steps=[], D=[2,3,5,7,11,13], i;
  function g(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }
  while(g(x,y)>1){
    for(i=0;i<D.length;i++){ if(x%D[i]===0 && y%D[i]===0){ steps.push(D[i]); x/=D[i]; y/=D[i]; break; } }
    if(i===D.length) break;
  }
  return {steps:steps, bottom:[x,y]};
}

/* ── 紙本練習題：B4 雙面、兩欄流動排版 ───────────────────
   固定格子遇到長題目會壓到作答線，所以改成每題先量出實際行數，
   再依需要的高度往下排，排滿一欄換下一欄，排滿兩欄換頁。      */
var B4W=709, B4H=1001, PPAD=32, PCOLS=2, PGAP=18;
var PCOLW=Math.floor((B4W-PPAD*2-PGAP*(PCOLS-1))/PCOLS);
var PAVAIL1=B4H-PPAD-20-(PPAD+112);   /* 第 1 面要放卷頭 */
var PAVAIL2=B4H-PPAD-20-(PPAD+44);    /* 第 2 面只放窄頁眉 */
var PSTEM_F='600 12.5px ', POPT_F='400 11.5px ';

function paperWrap(g, text, maxW, font, firstW){
  /* 逐字斷行對中文是必要的，但會把「3.41」拆成「3.4／1」、把結尾的「？」
     丟到下一行。所以先切成不可拆的詞塊：連續的數字（含小數點）算一塊，
     收尾標點黏在前一塊後面，再依寬度貪婪填行。 */
  g.font=font; var out=[];
  var CLOSE='？。，、）」』！：；%）';
  String(text).split('\n').forEach(function(para){
    var atoms=[], i=0;
    while(i<para.length){
      var ch=para.charAt(i);
      if(ch==='＿'){
        var bl=ch; i++;
        while(i<para.length && para.charAt(i)==='＿'){ bl+=para.charAt(i); i++; }
        atoms.push(bl); continue;
      }
      if(/[0-9]/.test(ch)){
        var num=ch; i++;
        while(i<para.length && /[0-9.]/.test(para.charAt(i))){ num+=para.charAt(i); i++; }
        atoms.push(num);
      }else{
        atoms.push(ch); i++;
      }
    }
    /* 收尾標點併進前一塊，避免孤行 */
    var merged=[];
    atoms.forEach(function(a){
      if(merged.length && a.length===1 && CLOSE.indexOf(a)>=0) merged[merged.length-1]+=a;
      else merged.push(a);
    });
    var cur='';
    merged.forEach(function(a){
      var t=cur+a;
      var lim=(out.length===0 && firstW) ? firstW : maxW;
      if(cur && g.measureText(t).width>lim){ out.push(cur); cur=a; }
      else cur=t;
    });
    out.push(cur);
  });
  return out;
}

/* 拆成可排版區塊並算高度。選擇題只留一點空隙，填空／計算題留 54pt 給計算過程。 */
function paperBlocks(qs){
  var g=document.createElement('canvas').getContext('2d');
  var tw=PCOLW-40, out=[];
  function headBlock(text){
    var hl=paperWrap(g, text, PCOLW, '700 12.5px '+FS);
    return {type:'head', lines:hl, h:14 + hl.length*15 + 10};
  }
  /* 克漏字版面：印整篇文章（空格內嵌編號）＋ 編號作答欄。
     50 個題目框塞不進兩面，而且學生本來就該從文章判讀，不是看拆散的單句。 */
  var cloze = (typeof PAPER_PASSAGES!=='undefined') && PAPER_PASSAGES && PAPER_PASSAGES.length;
  if(cloze){
    PAPER_PASSAGES.forEach(function(pa){
      if(PAPER_SECTIONS[pa.at]) out.push(headBlock(PAPER_SECTIONS[pa.at]));
      var lines=[];
      String(pa.text).split('\n').forEach(function(para){
        if(para.trim()===''){ lines.push({t:'', f:'400 12.5px '+FS}); return; }
        /* 文章裡的 [[n]] 換成「（n）＿＿＿＿」 */
        var shown=para.replace(/\[\[(\d+)\]\]/g, function(_,n){ return '（'+n+'）＿＿＿＿'; });
        paperWrap(g, shown, tw, '400 12.5px '+FS).forEach(function(ln){ lines.push({t:ln, f:'400 12.5px '+FS}); });
      });
      out.push({type:'psg', lines:lines, h:10 + lines.length*19 + 10});
    });
    /* 作答欄獨佔一整欄：不換欄的話它會從文章下方開始、再溢到下一欄頂端，
       讀起來顛倒，而且線被壓到只剩 70pt，四字成語寫不下。
       獨佔一欄之後一行放兩格就夠，每條線約 150pt。 */
    out.push({type:'colbreak', h:0});
    out.push(headBlock('作答欄（請把語詞寫在對應編號的橫線上）'));
    for(var k=0;k<qs.length;k+=2){
      var row=[];
      for(var j=0;j<2;j++){ if(k+j<qs.length) row.push(k+j+1); }
      out.push({type:'slots', ns:row, h:26});
    }
    return out;
  }
  /* 閱讀測驗：在指定題號前印一篇文章，後面的題目照常一題一格。
     整份都是克漏字才走上面的 cloze 分支，這裡是混合卷用的。 */
  var reads = (typeof PAPER_READINGS!=='undefined' && PAPER_READINGS) ? PAPER_READINGS : [];
  function pushReading(i){
    reads.filter(function(r){ return r.at===i; }).forEach(function(r){
      var lines=[], h=10;
      String(r.text).split('\n').forEach(function(para){
        /* 空行只給 8pt，整整一行 17pt 乘上五段就白吃掉半個題目的位置 */
        if(para.trim()===''){ lines.push({t:'', f:'400 12px '+FS, lh:8}); h+=8; return; }
        paperWrap(g, para, tw, '400 12px '+FS).forEach(function(ln){
          lines.push({t:ln, f:'400 12px '+FS, lh:17}); h+=17; });
      });
      out.push({type:'psg', lines:lines, h:h + 10});
    });
  }
  var compact = (typeof PAPER_COMPACT!=='undefined') && PAPER_COMPACT;
  qs.forEach(function(q,i){
    if(PAPER_SECTIONS[i]) out.push(headBlock(PAPER_SECTIONS[i]));
    pushReading(i);
    var isCh = /（[A-Ｄ]）|[①②③④⑤⑥]/.test(String(q.q));
    if(compact){
      /* 選擇題首行讓出 (　) 和題號；填寫題只讓出題號，答案直接寫在句子的空格上。 */
      var cw2  = PCOLW-28, cw1 = PCOLW-(isCh?74:30);
      var cl=[];
      String(q.q).split('\n').forEach(function(para,pi){
        var f=(pi===0?PSTEM_F:POPT_F)+FS;
        paperWrap(g,para,cw2,f,pi===0?cw1:null).forEach(function(ln){ cl.push({t:ln,f:f}); });
      });
      out.push({type:'qc', n:i+1, lines:cl, paren:isCh, h:8 + cl.length*15 + 8});
      return;
    }
    var lines=[];
    String(q.q).split('\n').forEach(function(para,pi){
      var f=(pi===0?PSTEM_F:POPT_F)+FS;
      paperWrap(g,para,tw,f).forEach(function(ln){ lines.push({t:ln,f:f}); });
    });
    var isChoice = isCh;
    /* 非選擇題預設留 46pt 給計算過程；國語那種只寫一個詞的卷子用不到，
       在設定區放 PAPER_WORK 就能改小，不然 35 題就會多擠出一面紙 */
    var defWork = (typeof PAPER_WORK!=='undefined' && PAPER_WORK!=null) ? PAPER_WORK : 46;
    var work = isChoice ? 12 : defWork;
    out.push({type:'q', n:i+1, lines:lines, work:work,
              h:16 + lines.length*15 + work + 34});
  });
  return out;
}

function paperPack(blocks){
  var pages=[], cols=[], cur=[], used=0;
  function avail(){ return pages.length===0 ? PAVAIL1 : PAVAIL2; }
  function pushCol(){ cols.push(cur); cur=[]; used=0;
    if(cols.length===PCOLS){ pages.push(cols); cols=[]; } }
  blocks.forEach(function(b){
    /* colbreak：強制換到下一欄，本身不佔高度也不畫任何東西 */
    if(b.type==='colbreak'){ if(used>0) pushCol(); return; }
    /* 大題標頭不要落在欄底變成孤行 */
    var need = b.h + (b.type==='head' ? 70 : 0);
    if(used>0 && used+need>avail()) pushCol();
    cur.push(b); used+=b.h;
  });
  if(cur.length) pushCol();
  if(cols.length){ while(cols.length<PCOLS) cols.push([]); pages.push(cols); }
  return pages;
}

function drawPracticeB4(cols, cls, page, pages, scale){
  var W=B4W, H=B4H, PAD=PPAD;
  var cv=document.createElement('canvas');
  cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
  cv._pw=W; cv._ph=H;                       /* 告訴 buildPdf 這頁是 B4 */
  var g=cv.getContext('2d'); g.setTransform(scale,0,0,scale,0,0);
  g.fillStyle="#ffffff"; g.fillRect(0,0,W,H);
  function txt(t,x,y,font,color,align){
    g.font=font; g.fillStyle=color; g.textAlign=align||'left'; g.textBaseline='middle';
    g.fillText(String(t),x,y);
  }
  function line(x1,y1,x2,y2,c,w,dash){
    g.save(); if(dash) g.setLineDash(dash);
    g.strokeStyle=c; g.lineWidth=w||.7; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); g.restore();
  }
  var top;
  if(page===1){
    txt(SCHOOL, PAD, PAD, '500 10px '+FS, PC.dim);
    txt('紙本練習題', W-PAD, PAD, '700 11px '+FS, PC.red, 'right');
    txt(paperTitle(), PAD, PAD+26, '700 19px '+FS, PC.ink);
    line(PAD, PAD+44, W-PAD, PAD+44, PC.line, 1.2);
    var fy=PAD+64;
    txt('班級', PAD, fy, '400 10px '+FS, PC.dim);
    line(PAD+26, fy+6, PAD+96, fy+6, PC.line, .8);
    if(cls) txt(cls, PAD+44, fy, '600 11px '+FM, PC.dim);
    txt('座號', PAD+112, fy, '400 10px '+FS, PC.dim);
    line(PAD+138, fy+6, PAD+198, fy+6, PC.line, .8);
    txt('姓名', PAD+214, fy, '400 10px '+FS, PC.dim);
    line(PAD+240, fy+6, PAD+390, fy+6, PC.line, .8);
    txt('分數', PAD+406, fy, '400 10px '+FS, PC.red);
    line(PAD+432, fy+6, PAD+532, fy+6, PC.line, .8);
    txt('日期', PAD+548, fy, '400 10px '+FS, PC.dim);
    line(PAD+574, fy+6, W-PAD, fy+6, PC.line, .8);
    /* 卷頭的作答說明。數學卷講計算過程、國語卷講選項與語詞，所以做成可覆寫 */
    txt((typeof PAPER_HINT!=='undefined' && PAPER_HINT) ? PAPER_HINT
        : '每題的答案都寫在下面的「答」橫線上。計算題和應用題請把計算過程寫在格子裡。',
        PAD, fy+28, '400 9.5px '+FS, PC.faint);
    top=PAD+112;
  }else{
    txt(paperTitle()+'　紙本練習題', PAD, PAD+6, '700 12px '+FS, PC.dim);
    txt('班級 __________　座號 ______　姓名 ____________', W-PAD, PAD+6, '400 10px '+FS, PC.dim, 'right');
    line(PAD, PAD+20, W-PAD, PAD+20, PC.line, 1);
    top=PAD+44;
  }
  cols.forEach(function(col,ci){
    var x=PAD+ci*(PCOLW+PGAP), y=top;
    col.forEach(function(b){
      if(b.type==='psg'){
        var py=y+14;
        b.lines.forEach(function(ln){
          if(ln.t) txt(ln.t, x+4, py, ln.f, PC.ink);
          py+=(ln.lh||19);
        });
        y+=b.h; return;
      }
      if(b.type==='qc'){
        var qy=y+10;
        if(b.paren){
          txt('（　　）', x+2, qy, '400 11.5px '+FS, PC.dim);
          txt(b.n+'.', x+48, qy, '700 11.5px '+FM, PC.red);
        }else{
          txt(b.n+'.', x+2, qy, '700 11.5px '+FM, PC.red);
        }
        b.lines.forEach(function(L,li){
          txt(L.t, li===0 ? x+(b.paren?74:28) : x+28, qy+li*15, L.f, PC.ink);
        });
        /* 題與題之間一條很淡的虛線，沒有框也看得出界線 */
        line(x, y+b.h-4, x+PCOLW, y+b.h-4, PC.hair, .5, [2,4]);
        y+=b.h; return;
      }
      if(b.type==='slots'){
        var sy=y+13, cw=Math.floor((PCOLW-6)/2);
        b.ns.forEach(function(num, j){
          var sx=x+2+j*cw;
          txt(num+'.', sx, sy, '700 11px '+FM, PC.red);
          line(sx+(num>=10?26:20), sy+7, sx+cw-10, sy+7, PC.line, .9);
        });
        y+=b.h; return;
      }
      if(b.type==='head'){
        (b.lines||[b.text]).forEach(function(L,li){
          txt(L, x, y+13+li*15, '700 12.5px '+FS, PC.ink);
        });
        line(x, y+b.h-8, x+PCOLW, y+b.h-8, PC.ink, 1.1);
      }else{
        g.strokeStyle=PC.hair; g.lineWidth=.9; g.strokeRect(x, y, PCOLW, b.h-10);
        txt(b.n+'.', x+8, y+16, '700 11.5px '+FM, PC.red);
        var ty=y+16;
        b.lines.forEach(function(L){ txt(L.t, x+30, ty, L.f, PC.ink); ty+=15; });
        var bb=y+b.h-16;
        line(x+8, bb-26, x+PCOLW-8, bb-26, PC.hair, .6, [3,3]);
        txt('答：', x+8, bb-13, '400 10px '+FS, PC.dim);
        line(x+34, bb-8, x+PCOLW-8, bb-8, PC.line, .8);
      }
      y+=b.h;
    });
  });
  txt('第 '+page+' / '+pages+' 面　（B4 雙面）', W-PAD, H-PAD+4, '400 9px '+FS, PC.faint, 'right');
  return cv;
}

function drawAnswerKey(qs, scale){
  var W=595, H=842, PAD=36;
  var cv=document.createElement('canvas');
  cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
  var g=cv.getContext('2d'); g.setTransform(scale,0,0,scale,0,0);
  g.fillStyle="#ffffff"; g.fillRect(0,0,W,H);
  function txt(t,x,y,font,color,align){
    g.font=font; g.fillStyle=color; g.textAlign=align||'left'; g.textBaseline='middle';
    g.fillText(String(t),x,y);
  }
  function line(x1,y1,x2,y2,c,w){ g.strokeStyle=c; g.lineWidth=w||.7; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }

  txt(SCHOOL, PAD, PAD, '500 10px '+FS, PC.dim);
  txt('教師用 · 請勿發給學生', W-PAD, PAD, '700 11px '+FS, PC.red, 'right');
  txt(paperTitle()+'　答案', PAD, PAD+24, '700 17px '+FS, PC.ink);
  line(PAD, PAD+40, W-PAD, PAD+40, PC.line, 1.2);

  /* 行距要除得剛好，多加 6 的話 40 題就會印到紙外面 */
  var y=PAD+62, RH=Math.min(28, (H-PAD-70-(PAD+62))/Math.max(1,qs.length));
  var FZ=(RH<20?10:11);
  var ANSX=PAD+330;
  function fit(text, maxW, font){
    g.font=font;
    var t=String(text).split('\n')[0];
    if(g.measureText(t).width<=maxW) return t;
    while(t.length>1 && g.measureText(t+'…').width>maxW) t=t.slice(0,-1);
    return t+'…';
  }
  /* 選擇題印圈號，老師對答只要看號碼；長選項再接前面幾個字當提示 */
  function ansShown(q){
    var a=String(q.a).trim(), s=String(q.q).replace(/\n/g,'　');
    var re=/([①②③④⑤⑥])[ 　]*([^①②③④⑤⑥）]*)/g, m;
    while((m=re.exec(s))){
      if(m[2].replace(/[ 　）]/g,'')===a) return m[1]+' '+a;
    }
    return a;
  }
  qs.forEach(function(q,i){
    txt(i+1+'.', PAD+4, y, '700 '+FZ+'px '+FM, PC.red);
    txt(fit(q.q, ANSX-(PAD+26)-10, '600 '+FZ+'px '+FS), PAD+26, y, '600 '+FZ+'px '+FS, PC.ink);
    txt(fit(ansShown(q), W-PAD-ANSX-4, '700 '+(FZ+1)+'px '+FM),
        ANSX, y, '700 '+(FZ+1)+'px '+FM, PC.leaf);
    var st=paperSteps(q.q);
    if(st && st.steps.length){
      txt('短除法：'+st.steps.join(' × ')+'　最下面兩個商：'+st.bottom.join('、'),
          ANSX+90, y, '400 9px '+FS, PC.dim);
    }
    line(PAD, y+RH*0.5, W-PAD, y+RH*0.5, PC.hair, .6);
    y+=RH;
  });
  txt('此頁為教師對答用，影印給學生時請抽掉。', PAD, H-PAD, '400 9px '+FS, PC.faint);
  return cv;
}


async function exportAnswerKey(btn){
  var qs=paperQuestions();
  if(!qs.length){ toast('還沒有題目可以印'); return; }
  var old=btn.textContent; btn.disabled=true; btn.textContent='產生中…';
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    download(paperTitle()+'_教師答案.pdf', await buildPdf([drawAnswerKey(qs, 2.4)]));
  }catch(e){ toast('PDF 產生失敗：'+(e && e.message || e)); }
  btn.disabled=false; btn.textContent=old;
}

async function exportPaper(btn){
  var qs=paperQuestions();
  if(!qs.length){ toast('還沒有題目可以印。請在 PAPER_QS 填入題目，或等有人交卷後再試'); return; }
  var old=btn.textContent; btn.disabled=true; btn.textContent='產生中…';
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    /* 學生卷只放 B4 那幾面。答案頁另一支按鈕匯出——印 30 份時不會跟著多印
       30 張答案，也不必每次在列印對話框指定頁碼 */
    var pgs=paperPack(paperBlocks(qs)), cvs=[];
    for(var p=0;p<pgs.length;p++){
      cvs.push(drawPracticeB4(pgs[p], CUR, p+1, pgs.length, 2.2));   /* B4 */
    }
    download(paperTitle()+'_學生卷.pdf', await buildPdf(cvs));
  }catch(e){ toast('PDF 產生失敗：'+(e && e.message || e)); }
  btn.disabled=false; btn.textContent=old;
}

function download(filename, data){
  var blob=new Blob([data],{type:'application/pdf'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename; a.style.display='none';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
  toast('已下載 '+filename);
}
async function exportPdf(classList, filename, btn){
  var old=btn.textContent; btn.disabled=true; btn.textContent='產生中…';
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    var specs=[];
    classList.forEach(function(c){ specs=specs.concat(classPages(c)); });
    var canvases=specs.map(function(s){ return drawPage(s, 2.4); });
    var pdf=await buildPdf(canvases);
    download(filename, pdf);
  }catch(e){
    toast('PDF 產生失敗：'+(e && e.message || e));
  }
  btn.disabled=false; btn.textContent=old;
}
$('pdf-class').onclick=function(){ exportPdf([CUR], paperTitle()+'_'+CUR+'.pdf', this); };
$('pdf-all').onclick  =function(){ exportPdf(CLASSES, paperTitle()+'_六年級全部.pdf', this); };

$('pdf-paper').onclick =function(){ exportPaper(this); };
$('pdf-key').onclick   =function(){ exportAnswerKey(this); };

(function(){ var b=$('brand');
  if(b) b.innerHTML = BRAND[0]+'<span>'+BRAND[1]+'</span><em>導師檢核</em>'; })();
boot();
})();
